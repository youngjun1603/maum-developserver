name: Deploy to Staging

on:
  push:
    branches: [dev]

jobs:
  deploy-maumful-staging:
    name: maumful → staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy maumful-dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: maumful-main
          command: deploy --config wrangler.dev.toml

  deploy-maumcouple-staging:
    name: maumcouple → staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy maumcouple-dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: package/maumcouple
          command: deploy --config wrangler.dev.toml
