name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-maumful:
    name: maumful → production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy maumful
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: maumful-main
          command: deploy

  deploy-maumcouple:
    name: maumcouple → production
    runs-on: ubuntu-latest
    needs: deploy-maumful
    steps:
      - uses: actions/checkout@v4

      - name: Deploy maumcouple
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: package/maumcouple
          command: deploy
