name: Build Android APK (TWA)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '앱 버전 (예: 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: '버전 코드 (정수, 올릴 때마다 +1)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # ── 키스토어 준비 ────────────────────────────────────────
      # 최초 실행: KEYSTORE_BASE64 시크릿이 없으면 새로 생성
      # 이후 실행: 저장된 시크릿에서 복원
      - name: Restore keystore from secret
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android-keystore.jks

      - name: Generate NEW keystore (최초 1회만 실행됨)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          keytool -genkey -v \
            -keystore android-keystore.jks \
            -alias maumful \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'maumful_temp_2024' }}" \
            -keypass "${{ secrets.KEYSTORE_KEY_PASSWORD || 'maumful_temp_2024' }}" \
            -dname "CN=마음풀, OU=App, O=MaumfulService, L=Seoul, S=Seoul, C=KR"

          echo ""
          echo "========================================================"
          echo "  ★ 아래 정보를 GitHub Secrets에 저장하세요 ★"
          echo "========================================================"
          echo ""
          echo "[1] SHA256 Fingerprint (assetlinks.json에 입력)"
          keytool -list -v \
            -keystore android-keystore.jks \
            -alias maumful \
            -storepass "maumful_temp_2024" \
            | grep "SHA256"
          echo ""
          echo "[2] KEYSTORE_BASE64 (GitHub Secret 'KEYSTORE_BASE64' 에 저장)"
          base64 -w 0 android-keystore.jks
          echo ""
          echo "========================================================"

      # ── twa-manifest.json 버전 업데이트 ────────────────────
      - name: Update version in twa-manifest.json
        run: |
          PASS="${{ secrets.KEYSTORE_PASSWORD || 'maumful_temp_2024' }}"
          KEY_PASS="${{ secrets.KEYSTORE_KEY_PASSWORD || 'maumful_temp_2024' }}"
          jq \
            --arg v "${{ github.event.inputs.version }}" \
            --argjson vc "${{ github.event.inputs.version_code }}" \
            --arg pass "$PASS" \
            --arg kpass "$KEY_PASS" \
            '.appVersionName = $v | .appVersionCode = $vc | .signingKey.storepassword = $pass | .signingKey.keypassword = $kpass' \
            android/twa-manifest.json > /tmp/twa-manifest-updated.json
          cp /tmp/twa-manifest-updated.json android/twa-manifest.json

      # ── Bubblewrap 빌드 ─────────────────────────────────────
      - name: Build TWA APK
        working-directory: android
        run: |
          bubblewrap build --skipPwaValidation

      # ── 빌드 결과물 업로드 ──────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maumful-android-v${{ github.event.inputs.version }}
          path: |
            android/app-release-signed.apk
            android/app-release-signed.aab
          if-no-files-found: warn
          retention-days: 30
