name: Build Android APK (TWA)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '앱 버전 (예: 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: '버전 코드 (정수, 올릴 때마다 +1)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Android SDK 공식 Action으로 설치 ────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 필수 패키지 설치 ─────────────────────────────────────
      - name: Install Android SDK packages
        run: |
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          echo "✅ ANDROID_HOME=$ANDROID_HOME"
          echo "✅ JAVA_HOME=$JAVA_HOME"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # ── expect 설치 (TTY 시뮬레이션으로 대화형 프롬프트 처리) ──
      - name: Install expect
        run: sudo apt-get install -y expect

      # ── Bubblewrap 설정 ───────────────────────────────────────
      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          jq -n \
            --arg jdk "$JAVA_HOME" \
            --arg sdk "$ANDROID_HOME" \
            '{"jdkPath": $jdk, "androidSdkPath": $sdk}' \
            > ~/.bubblewrap/config.json
          echo "✅ Bubblewrap config:"
          cat ~/.bubblewrap/config.json

      # ── 키스토어 존재 여부 확인 ──────────────────────────────
      - name: Check keystore secret
        id: keystore-check
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── 기존 키스토어 복원 (2회차 이후) ─────────────────────
      - name: Restore keystore from secret
        if: steps.keystore-check.outputs.has_keystore == 'true'
        run: echo "$KEYSTORE_B64" | base64 -d > android-keystore.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── 신규 키스토어 생성 (최초 1회) ────────────────────────
      - name: Generate NEW keystore (최초 1회만 실행됨)
        if: steps.keystore-check.outputs.has_keystore == 'false'
        run: |
          STORE_PASS="${KEYSTORE_PASSWORD:-maumful_temp_2024}"
          KEY_PASS="${KEYSTORE_KEY_PASSWORD:-maumful_temp_2024}"

          keytool -genkey -v \
            -keystore android-keystore.jks \
            -alias maumful \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=maumful, OU=App, O=MaumfulService, L=Seoul, S=Seoul, C=KR"

          echo ""
          echo "========================================================"
          echo "  ★ 아래 정보를 GitHub Secrets에 저장하세요 ★"
          echo "========================================================"
          echo "[1] SHA256 Fingerprint (assetlinks.json에 입력)"
          keytool -list -v \
            -keystore android-keystore.jks \
            -alias maumful \
            -storepass "$STORE_PASS" \
            | grep "SHA256"
          echo ""
          echo "[2] KEYSTORE_BASE64 (GitHub Secret KEYSTORE_BASE64 에 저장)"
          base64 -w 0 android-keystore.jks
          echo ""
          echo "========================================================"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      # ── twa-manifest.json 버전 + 패스워드 업데이트 ──────────
      - name: Update twa-manifest.json
        run: |
          STORE_PASS="${KEYSTORE_PASSWORD:-maumful_temp_2024}"
          KEY_PASS="${KEYSTORE_KEY_PASSWORD:-maumful_temp_2024}"
          jq \
            --arg v "${{ github.event.inputs.version }}" \
            --argjson vc ${{ github.event.inputs.version_code }} \
            --arg pass "$STORE_PASS" \
            --arg kpass "$KEY_PASS" \
            '.appVersionName = $v | .appVersionCode = $vc | .signingKey.storepassword = $pass | .signingKey.keypassword = $kpass' \
            android/twa-manifest.json > /tmp/twa-updated.json
          cp /tmp/twa-updated.json android/twa-manifest.json
          echo "✅ twa-manifest.json updated"
          cat android/twa-manifest.json
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      # ── Android 프로젝트 파일 생성 ────────────────────────────
      # bubblewrap update: twa-manifest.json → gradlew, app/, gradle/ 등 생성
      # 체크섬도 함께 생성되므로 이후 build에서 "regenerate?" 프롬프트 안 뜸
      - name: Generate Android project (bubblewrap update)
        working-directory: android
        run: |
          expect << 'EXPECT_SCRIPT'
          set timeout 180
          log_user 1
          spawn bubblewrap update
          expect {
            -re {[Yy]/[Nn]} { send "y\r"; exp_continue }
            eof
          }
          lassign [wait] _ _ _ rc
          exit $rc
          EXPECT_SCRIPT

      # ── gradlew 존재 확인 ─────────────────────────────────────
      - name: Verify Android project files
        working-directory: android
        run: |
          echo "=== android/ 디렉토리 내용 ==="
          ls -la
          if [ ! -f gradlew ]; then
            echo "❌ gradlew not found — bubblewrap update 실패"
            exit 1
          fi
          chmod +x gradlew
          echo "✅ gradlew 존재 확인"

      # ── Bubblewrap 빌드 ─────────────────────────────────────
      - name: Build TWA APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          export BUILD_STORE_PASS="${KEYSTORE_PASSWORD:-maumful_temp_2024}"
          export BUILD_KEY_PASS="${KEYSTORE_KEY_PASSWORD:-maumful_temp_2024}"

          expect << 'EXPECT_SCRIPT'
          set timeout 600
          log_user 1
          set store_pass $env(BUILD_STORE_PASS)
          set key_pass $env(BUILD_KEY_PASS)
          spawn bubblewrap build --skipPwaValidation
          expect {
            -re {[Yy]/[Nn]}         { send "n\r";          exp_continue }
            "Key Store:"             { send "$store_pass\r"; exp_continue }
            "Password for key"       { send "$key_pass\r";   exp_continue }
            "Enter key password for" { send "$key_pass\r";   exp_continue }
            eof
          }
          lassign [wait] _ _ _ rc
          exit $rc
          EXPECT_SCRIPT

      # ── 빌드 결과물 업로드 ──────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maumful-android-v${{ github.event.inputs.version }}
          path: |
            android/app-release-signed.apk
            android/app-release-signed.aab
          if-no-files-found: warn
          retention-days: 30
