name: Build Android APK (TWA)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '앱 버전 (예: 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: '버전 코드 (정수, 올릴 때마다 +1)'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Android SDK 라이선스 자동 동의 ───────────────────────
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # ── Bubblewrap이 시스템 SDK/JDK를 사용하도록 설정 ────────
      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          echo "Bubblewrap config:"
          cat ~/.bubblewrap/config.json

      # ── 키스토어 존재 여부 확인 ──────────────────────────────
      - name: Check keystore secret
        id: keystore-check
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── 기존 키스토어 복원 (2회차 이후) ─────────────────────
      - name: Restore keystore from secret
        if: steps.keystore-check.outputs.has_keystore == 'true'
        run: echo "$KEYSTORE_B64" | base64 -d > android-keystore.jks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      # ── 신규 키스토어 생성 (최초 1회) ────────────────────────
      - name: Generate NEW keystore (최초 1회만 실행됨)
        if: steps.keystore-check.outputs.has_keystore == 'false'
        run: |
          STORE_PASS="${KEYSTORE_PASSWORD:-maumful_temp_2024}"
          KEY_PASS="${KEYSTORE_KEY_PASSWORD:-maumful_temp_2024}"

          keytool -genkey -v \
            -keystore android-keystore.jks \
            -alias maumful \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=maumful, OU=App, O=MaumfulService, L=Seoul, S=Seoul, C=KR"

          echo ""
          echo "========================================================"
          echo "  ★ 아래 정보를 GitHub Secrets에 저장하세요 ★"
          echo "========================================================"
          echo ""
          echo "[1] SHA256 Fingerprint (assetlinks.json에 입력)"
          keytool -list -v \
            -keystore android-keystore.jks \
            -alias maumful \
            -storepass "$STORE_PASS" \
            | grep "SHA256"
          echo ""
          echo "[2] KEYSTORE_BASE64 (GitHub Secret KEYSTORE_BASE64 에 저장)"
          base64 -w 0 android-keystore.jks
          echo ""
          echo "========================================================"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      # ── twa-manifest.json 버전 + 패스워드 업데이트 ──────────
      - name: Update twa-manifest.json
        run: |
          STORE_PASS="${KEYSTORE_PASSWORD:-maumful_temp_2024}"
          KEY_PASS="${KEYSTORE_KEY_PASSWORD:-maumful_temp_2024}"
          jq \
            --arg v "${{ github.event.inputs.version }}" \
            --argjson vc ${{ github.event.inputs.version_code }} \
            --arg pass "$STORE_PASS" \
            --arg kpass "$KEY_PASS" \
            '.appVersionName = $v | .appVersionCode = $vc | .signingKey.storepassword = $pass | .signingKey.keypassword = $kpass' \
            android/twa-manifest.json > /tmp/twa-updated.json
          cp /tmp/twa-updated.json android/twa-manifest.json
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      # ── Bubblewrap 빌드 ─────────────────────────────────────
      - name: Build TWA APK
        working-directory: android
        run: bubblewrap build --skipPwaValidation

      # ── 빌드 결과물 업로드 ──────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maumful-android-v${{ github.event.inputs.version }}
          path: |
            android/app-release-signed.apk
            android/app-release-signed.aab
          if-no-files-found: warn
          retention-days: 30
