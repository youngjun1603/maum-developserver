name = "maumcouple"
main = "src/index.tsx"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "couple.maumful.com", custom_domain = true }
]

[assets]
directory = "./public"

[[d1_databases]]
binding       = "DB"
database_name = "maumful-db"
database_id   = "f8046693-876a-4ae4-b734-20c515f9994f"

[[kv_namespaces]]
binding = "KV"
id      = "9f7426807e924916be4dec75793422d9"

[triggers]
crons = ["0 3 1 * *"]   # 매월 1일 03:00 UTC: 만료 세션 정리 (주간 이메일은 cron 5개 한도로 비활성)
