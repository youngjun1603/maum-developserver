<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>마음수달 — 우리 아이 마음 통역</title>
<meta name="description" content="아이가 수달 친구 '또또'와 나눈 대화를 부모님이 이해할 수 있는 따뜻한 코칭으로 통역해 드려요. 정서 통역 참고용 서비스." />
<meta property="og:type" content="website" />
<meta property="og:title" content="마음수달 — 우리 아이 마음 통역" />
<meta property="og:description" content="아이의 속마음을 또또가 듣고 부모님께 통역해요. 무료로 체험해 보세요." />
<meta property="og:url" content="https://maumotter.com" />
<meta property="og:image" content="https://maumotter.com/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<style>
  :root { --cream:#F4F1EA; --ink:#2E2A26; --muted:#8A8276; --water:#5B7C7D; --water-d:#456062; --brown:#8C6A4E; --line:#E3DDD1; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif; background:var(--cream); color:var(--ink); }
  #root { max-width:480px; margin:0 auto; min-height:100vh; }
  input,textarea,button{ font-family:inherit; font-size:15px; }
  .wrap{ padding:20px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:14px; }
  .btn{ width:100%; padding:14px; border:none; border-radius:14px; background:var(--water); color:#fff; font-weight:700; cursor:pointer; }
  .btn:disabled{ opacity:.5; }
  .btn-ghost{ background:#fff; color:var(--water-d); border:1.5px solid var(--line); }
  .field{ width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; margin-bottom:10px; background:#fff; }
  .muted{ color:var(--muted); font-size:13px; }
  .h1{ font-size:22px; font-weight:800; margin:0 0 4px; }
  .pill{ display:inline-block; padding:3px 10px; border-radius:20px; background:#EEF3F2; color:var(--water-d); font-size:12px; font-weight:700; }
  .err{ color:#c0492f; font-size:13px; margin:6px 0; }
  /* 채팅 */
  .chat{ display:flex; flex-direction:column; gap:10px; padding:16px; }
  .msg{ max-width:78%; padding:11px 14px; border-radius:16px; line-height:1.55; font-size:15px; }
  .msg.otter{ align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:5px; }
  .msg.child{ align-self:flex-end; background:var(--water); color:#fff; border-bottom-right-radius:5px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--cream); }
  @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.08); opacity:.85; } }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-1deg); } 50%{ transform:translateY(-7px) rotate(1deg); } }
  @keyframes talk{ 0%,100%{ transform:scaleY(0.6); } 50%{ transform:scaleY(1.15); } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);
const TOKEN_KEY = 'maumotter_token';
// ⚠️ 스마트스토어 상품(또는 스토어) URL — 등록 후 채우면 '구매하기' 버튼 활성화.
const STORE_URL = '';

function api(path, { method='GET', body, token } = {}) {
  return fetch('/api'+path, {
    method,
    headers: { 'Content-Type':'application/json', ...(token ? { Authorization:'Bearer '+token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  }).then(async r => { const d = await r.json().catch(()=>({})); if(!r.ok){ const e=new Error(d.error||'오류가 발생했어요'); e.code=d.code; e.status=r.status; throw e; } return d; });
}
// 제휴 추적: ?ref=파트너 최초 유입 1회 저장(first-touch)
try{ var _r=new URLSearchParams(location.search).get('ref'); if(_r && !localStorage.getItem('maumotter_ref')) localStorage.setItem('maumotter_ref', _r.slice(0,64)); }catch(e){}

// 이메일 인증 안내 — 발송 설정됨 && 미인증일 때만 표시
function VerifyBanner({ token }) {
  const [st,setSt]=useState(null); const [msg,setMsg]=useState('');
  useEffect(()=>{ api('/auth/me',{token}).then(setSt).catch(()=>{}); },[]);
  if(!st || !st.email_required || st.email_verified) return null;
  async function resend(){ setMsg('보내는 중…'); try{ await api('/auth/resend-verify',{method:'POST',token}); setMsg('인증 메일을 다시 보냈어요. 메일함(스팸함 포함)을 확인해 주세요.'); }catch(e){ setMsg(e.message); } }
  return html`<div class="card" style=${{background:'#FFF7ED',border:'1px solid #FED7AA'}}>
    <b>✉️ 이메일 인증이 필요해요</b>
    <div class="muted" style=${{marginTop:6}}>가입 시 보낸 인증 메일의 링크를 눌러주세요. 인증 후 이용권 등록 등 모든 기능을 이용할 수 있어요.</div>
    <button class="btn btn-ghost" style=${{marginTop:10}} onClick=${resend}>인증 메일 다시 보내기</button>
    ${msg && html`<div class="muted" style=${{marginTop:8,color:'#3B6FB5'}}>${msg}</div>`}
  </div>`;
}
// 이용권(쿼터) 표시 + 코드 등록 (부모 화면)
function EntitlementCard({ token }) {
  const [ent,setEnt]=useState(null); const [code,setCode]=useState(''); const [msg,setMsg]=useState(''); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false); const [hist,setHist]=useState(null);
  useEffect(()=>{ api('/entitlement',{token}).then(d=>setEnt(d.entitlement)).catch(()=>{}); },[]);
  const TYPE_LABEL={sub_light:'구독 라이트',sub_pro:'구독 프로',pack10:'회차권 10회'};
  async function redeem(){ if(!code.trim())return; setErr('');setMsg('');setBusy(true);
    try{ const d=await api('/coupon/redeem',{method:'POST',token,body:{code}}); setEnt(d.entitlement); setCode(''); setMsg('등록 완료! 이용권이 적용됐어요.'); }
    catch(e){ setErr(e.message); } finally{ setBusy(false); } }
  async function toggleHist(){ if(hist!==null){ setHist(null); return; } try{ const d=await api('/history',{token}); setHist(d.redemptions||[]); }catch(e){ setHist([]); } }
  const planLabel = ent ? (ent.plan==='pro'?'프로':ent.plan==='light'?'라이트':'무료') : '';
  return html`<div class="card" style=${{marginTop:16}}>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <b>🎟️ 이용권</b>
      ${ent && html`<span class="pill">${planLabel} · 남은 통역 ${ent.totalRemaining}회</span>`}
    </div>
    ${ent && html`<div class="muted" style=${{marginTop:6,fontSize:12}}>이번 달 ${ent.used}/${ent.monthlyAllowance}회 사용${ent.packRemaining?` · 회차권 ${ent.packRemaining}회`:''}${ent.subActive?` · 구독 ~${(ent.subExpires||'').slice(0,10)}`:''}</div>`}
    <div style=${{display:'flex',gap:8,marginTop:10}}>
      <input class="field" style=${{margin:0,flex:1}} placeholder="이용권 코드 입력" value=${code} onInput=${e=>setCode(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter')redeem();}} />
      <button class="btn" style=${{width:'auto',padding:'12px 16px'}} disabled=${busy||!code.trim()} onClick=${redeem}>등록</button>
    </div>
    ${msg && html`<div class="muted" style=${{color:'#3B6FB5',marginTop:8}}>${msg}</div>`}
    ${err && html`<div class="err" style=${{marginTop:8}}>${err}</div>`}
    <div class="muted" style=${{marginTop:8,fontSize:12}}>통역(또또와의 대화 1번)에 1회 차감.</div>
    <div class="muted" style=${{marginTop:8,fontSize:12,cursor:'pointer'}} onClick=${toggleHist}>이용 내역 ${hist===null?'보기':'닫기'} ▾</div>
    ${hist!==null && html`<div style=${{marginTop:4}}>${hist.length===0
      ? html`<div class="muted" style=${{fontSize:12}}>아직 등록한 이용권이 없어요.</div>`
      : hist.map((h,i)=>html`<div key=${i} class="muted" style=${{fontSize:12,padding:'3px 0',borderTop:i?'1px solid #E3E8F0':'none'}}>${(h.created_at||'').slice(0,10)} · ${TYPE_LABEL[h.type]||h.type} · <span style=${{fontFamily:'monospace'}}>${h.code}</span></div>`)}</div>`}
    <div style=${{marginTop:12,paddingTop:12,borderTop:'1px solid #E3E8F0'}}>
      <div class="muted" style=${{fontSize:12,marginBottom:6}}>🛒 이용권 구매 (스마트스토어)</div>
      <div class="muted" style=${{fontSize:13,lineHeight:1.7,color:'#234E86'}}>라이트 30일·월 30회 4,900원 · 프로 30일·월 100회 9,900원 · 회차권 10회(60일) 4,900원</div>
      ${STORE_URL
        ? html`<a href=${STORE_URL} target="_blank" rel="noopener noreferrer" class="btn" style=${{display:'block',textAlign:'center',textDecoration:'none',marginTop:10}}>스마트스토어에서 구매하기 →</a>`
        : html`<div class="muted" style=${{fontSize:12,marginTop:8}}>스토어 오픈 준비 중이에요. 구매 후 받은 코드를 위에 등록하시면 됩니다.</div>`}
    </div>
  </div>`;
}

// face-api.js 지연 로더 (카메라 켤 때만). 온디바이스 표정 분석 — 영상 원본은 기기 밖으로 안 나감(spec 2-8/7-C).
let _faceApiPromise = null;
function loadFaceApi() {
  if (_faceApiPromise) return _faceApiPromise;
  _faceApiPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js';
    s.onload = async () => {
      try {
        const M = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
        await window.faceapi.nets.tinyFaceDetector.loadFromUri(M);
        await window.faceapi.nets.faceExpressionNet.loadFromUri(M);
        resolve(window.faceapi);
      } catch (e) { reject(e); }
    };
    s.onerror = reject; document.head.appendChild(s);
  });
  return _faceApiPromise;
}
const EXPR_LABEL = { happy:'웃음', neutral:'무표정', sad:'시무룩', angry:'찡그림', surprised:'놀람', fearful:'긴장', disgusted:'찌푸림' };

function Auth({ onLogin }) {
  const [mode,setMode]=useState('login');
  const [email,setEmail]=useState(''); const [pw,setPw]=useState(''); const [name,setName]=useState('');
  const [err,setErr]=useState(''); const [loading,setLoading]=useState(false); const [sent,setSent]=useState(false);
  async function forgot(){ setErr(''); setLoading(true); try{ await api('/auth/forgot-password',{method:'POST',body:{email}}); setSent(true); }catch(e){ setErr(e.message); } finally{ setLoading(false); } }
  async function submit(){
    setErr(''); setLoading(true);
    try{
      const ref = localStorage.getItem('maumotter_ref')||undefined;
      const d = await api('/auth/'+(mode==='login'?'login':'register'), { method:'POST', body: mode==='register'?{ email, password:pw, name, ref }:{ email, password:pw } });
      if(mode==='register') localStorage.removeItem('maumotter_ref');
      localStorage.setItem(TOKEN_KEY, d.token); onLogin(d.token, d.user);
    }catch(e){ setErr(e.message); } finally{ setLoading(false); }
  }
  return html`<div class="wrap">
    <div style=${{textAlign:'center', padding:'28px 0 18px'}}>
      <img src="/otto.jpg" alt="또또" style=${{width:140,height:140,objectFit:'cover',borderRadius:32,boxShadow:'0 8px 22px rgba(0,0,0,0.14)',animation:'bob 3.6s ease-in-out infinite'}} />
      <div class="h1" style=${{marginTop:14}}>마음수달</div>
      <div class="muted">우리 아이의 속마음, 또또가 들어주고<br/>부모님께 따뜻하게 통역해드려요</div>
    </div>
    <div class="card" style=${{background:'#F2F7FD'}}>
      <b>🦦 아이의 속마음, 또또가 통역해요</b>
      <div class="muted" style=${{marginTop:8,lineHeight:1.7,color:'#234E86'}}>아이가 수달 친구 '또또'와 도란도란 이야기하면, 그 대화를 부모님이 이해·행동할 수 있는 <b>따뜻한 코칭</b>으로 통역해 드려요. 또또는 아이의 친구를 대신하지 않는, 아이와 부모님 사이의 <b>다리</b>예요.</div>
    </div>
    <div class="card">
      <div class="muted" style=${{fontSize:13,marginBottom:8}}>이렇게 통역해요</div>
      <div style=${{lineHeight:1.9}}>
        <div><b>1.</b> 아이가 또또와 짧게 이야기해요(말·글)</div>
        <div><b>2.</b> AI가 아이의 정서를 <b>통역</b>해요</div>
        <div><b>3.</b> 부모님이 리포트로 이해하고 다가가요</div>
      </div>
    </div>
    <div style=${{display:'flex',flexWrap:'wrap',gap:6,justifyContent:'center',marginBottom:14}}>
      <span class="pill">부모님 기기 전용</span><span class="pill">"진짜가 아닌 친구" 고지</span><span class="pill">비밀 강요 없음</span><span class="pill">영상 저장 안 함</span>
    </div>
    <div class="card">
      ${mode==='register' && html`<input class="field" placeholder="이름(선택)" value=${name} onInput=${e=>setName(e.target.value)} />`}
      <input class="field" type="email" placeholder="이메일" value=${email} onInput=${e=>setEmail(e.target.value)} />
      ${mode!=='forgot' && html`<input class="field" type="password" placeholder="비밀번호 (8자 이상)" value=${pw} onInput=${e=>setPw(e.target.value)} />`}
      ${err && html`<div class="err">${err}</div>`}
      ${mode==='forgot'
        ? (sent
          ? html`<div class="muted" style=${{color:'#3B6FB5'}}>재설정 메일을 보냈어요. 메일함(스팸함 포함)을 확인해 주세요.</div>`
          : html`<button class="btn" disabled=${loading} onClick=${forgot}>${loading?'보내는 중…':'재설정 메일 보내기'}</button>`)
        : html`<button class="btn" disabled=${loading} onClick=${submit}>${loading?'잠시만요…':(mode==='login'?'로그인':'가입하기')}</button>`}
      <div style=${{textAlign:'center', marginTop:12}}>
        <span class="muted" style=${{cursor:'pointer'}} onClick=${()=>{setMode(mode==='login'?'register':'login');setErr('');setSent(false);}}>
          ${mode==='login'?'처음이신가요? 가입하기':(mode==='forgot'?'← 로그인으로':'이미 계정이 있어요 · 로그인')}
        </span>
      </div>
      ${mode==='login' && html`<div class="muted" style=${{textAlign:'center',marginTop:8,fontSize:13,cursor:'pointer'}} onClick=${()=>{setMode('forgot');setErr('');setSent(false);}}>비밀번호를 잊으셨나요?</div>`}
    </div>
    <div class="muted" style=${{textAlign:'center'}}>부모님 휴대폰에서, 아이와 함께 사용하는 서비스예요.<br/>본 서비스는 의학적 진단이 아닙니다.</div>
  </div>`;
}

function Dashboard({ token, user, onLogout, onStart, onReports, onSettings }) {
  const [children,setChildren]=useState([]); const [latest,setLatest]=useState({}); const [adding,setAdding]=useState(false);
  const [name,setName]=useState(''); const [age,setAge]=useState(''); const [gender,setGender]=useState(''); const [interests,setInterests]=useState(''); const [err,setErr]=useState('');
  function load(){
    api('/children',{token}).then(d=>setChildren(d.children)).catch(()=>{});
    api('/reports',{token}).then(d=>{ const m={}; (d.reports||[]).forEach(r=>{ if(!m[r.child_id]) m[r.child_id]=r; }); setLatest(m); }).catch(()=>{}); // DESC → child별 첫 항목=최근
  }
  useEffect(load,[]);
  async function add(){ setErr(''); if(!name.trim()){ setErr('아이 애칭을 입력해주세요'); return; }
    try{ await api('/children',{method:'POST',token,body:{name,age:age?Number(age):null,gender:gender||null,interests:interests||null}}); setName('');setAge('');setGender('');setInterests('');setAdding(false); load(); }catch(e){setErr(e.message);} }
  return html`<div>
    <div class="topbar"><b>🦦 마음수달</b><div style=${{display:'flex',gap:14,alignItems:'center'}}>
      <span class="muted" style=${{cursor:'pointer'}} onClick=${onSettings}>설정</span>
      <span class="muted" style=${{cursor:'pointer'}} onClick=${onLogout}>로그아웃</span>
    </div></div>
    <div class="wrap">
      <${VerifyBanner} token=${token} />
      <div class="h1" style=${{marginBottom:12}}>우리 아이</div>
      ${children.length===0 && html`<div class="card" style=${{background:'#F2F7FD'}}>
        <b>🦦 시작해 볼까요?</b>
        <div class="muted" style=${{marginTop:6,lineHeight:1.8,color:'#234E86'}}>1. 아래에서 <b>우리 아이를 등록</b>하세요<br/>2. <b>이야기 시작</b>으로 또또와 대화해요<br/>3. 끝나면 <b>통역 리포트</b>를 확인하세요</div>
      </div>`}
      ${children.map(ch => { let lb=null; try{lb=localStorage.getItem('maumotter_buddy_'+ch.id);}catch{} const bud=BUDDIES.find(b=>b.key===lb); return html`<div class="card" key=${ch.id}>
        <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style=${{display:'flex',alignItems:'center',gap:10}}>
            ${bud && html`<img src=${bud.img} alt=${bud.name} style=${{width:40,height:40,borderRadius:'50%',objectFit:'cover'}} />`}
            <div><b>${ch.name}</b> <span class="muted">${ch.age?ch.age+'세':''}</span>${bud?html`<div class="muted" style=${{fontSize:12}}>지난번 친구: ${bud.name}</div>`:''}</div>
          </div>
          ${latest[ch.id]?.crisis_flag?html`<span class="pill" style=${{background:'#FFF4EE',color:'#c0492f'}}>살펴보기</span>`:''}
        </div>
        ${latest[ch.id] && html`<div class="muted" style=${{marginTop:8,fontSize:13,lineHeight:1.5}}>최근 통역(${(latest[ch.id].created_at||'').slice(0,10)})<br/>${latest[ch.id].summary||''}</div>`}
        <div style=${{display:'flex',gap:8,marginTop:12}}>
          <button class="btn" style=${{flex:1}} onClick=${()=>onStart(ch)}>이야기 시작</button>
          <button class="btn btn-ghost" style=${{flex:1}} onClick=${()=>onReports(ch)}>통역 리포트</button>
        </div>
      </div>`; })}
      ${adding ? html`<div class="card">
        <input class="field" placeholder="아이 애칭" value=${name} onInput=${e=>setName(e.target.value)} />
        <input class="field" type="number" placeholder="나이 (3~9)" value=${age} onInput=${e=>setAge(e.target.value)} />
        <select class="field" value=${gender} onChange=${e=>setGender(e.target.value)}>
          <option value="">성별 (선택)</option><option value="남아">남아</option><option value="여아">여아</option><option value="비공개">비공개</option>
        </select>
        <input class="field" placeholder="관심사 (예: 공룡, 그림 — 선택)" value=${interests} onInput=${e=>setInterests(e.target.value)} />
        ${err && html`<div class="err">${err}</div>`}
        <button class="btn" onClick=${add}>등록</button>
        <button class="btn btn-ghost" style=${{marginTop:8}} onClick=${()=>setAdding(false)}>취소</button>
      </div>` : html`<button class="btn btn-ghost" onClick=${()=>setAdding(true)}>+ 아이 등록</button>`}
      <${EntitlementCard} token=${token} />
      <div class="muted" style=${{textAlign:'center',marginTop:24,fontSize:12,lineHeight:1.9}}>
        <a href="/privacy" style=${{color:'inherit'}}>개인정보처리방침</a> · <a href="/terms" style=${{color:'inherit'}}>이용약관</a> · <a href="/faq" style=${{color:'inherit'}}>고객센터</a> · <a href="/account-deletion" style=${{color:'inherit'}}>회원 탈퇴</a>
      </div>
    </div>
  </div>`;
}

// 음성: STT(webkitSpeechRecognition)·TTS(speechSynthesis). spec 4.5 — 못 읽는 아이가 말로 대화. 음성 원본은 서버로 안 보냄(텍스트만).
const BUDDIES=[{key:'otto',name:'또또',img:'/otto.jpg',talk:'/otto_talk.jpg'},{key:'lala',name:'라라',img:'/lala.jpg',talk:'/lala_talk.jpg'}];
function ChildChat({ token, child, onEnd, onBack }) {
  const [buddy,setBuddy]=useState(null);
  const [sid,setSid]=useState(null); const [msgs,setMsgs]=useState([]); const [input,setInput]=useState('');
  const [busy,setBusy]=useState(false); const [ending,setEnding]=useState(false); const endRef=useRef();
  const [secsLeft,setSecsLeft]=useState(12*60); const finishRef=useRef();   // 세션 10~15분 제한(컴패니언화 방지, spec 2-3)
  const [voiceOn,setVoiceOn]=useState(true); const [listening,setListening]=useState(false); const recRef=useRef(null);
  const [started,setStarted]=useState(false); const voiceRef=useRef(null); const [speaking,setSpeaking]=useState(false);   // started=오디오 잠금해제(모바일 자동재생 우회)·핸즈프리 시작
  const speakingRef=useRef(false); const busyRef=useRef(false); const sendTextRef=useRef(null); const manualStopRef=useRef(false);
  const [showText,setShowText]=useState(false);
  const SRsupported = typeof window!=='undefined' && !!(window.SpeechRecognition||window.webkitSpeechRecognition);
  const [camOn,setCamOn]=useState(false); const [camLoading,setCamLoading]=useState(false);   // 표정 카메라(온디바이스, spec 2-8/7-C)
  const videoRef=useRef(null); const streamRef=useRef(null); const detTimerRef=useRef(null); const exprRef=useRef({});
  const audioRef=useRef(null);   // OpenAI TTS 재생용(모바일 자동재생 잠금해제 후 사용)

  function pickVoice(){ try{ const vs=(window.speechSynthesis?.getVoices()||[]).filter(v=>(v.lang||'').toLowerCase().startsWith('ko')); if(vs.length) voiceRef.current = vs.find(v=>/google|naver|네이버|microsoft|yuna|sora|heami|seoyeon|nara/i.test(v.name)) || vs[0]; }catch{} }
  function setSpk(v){ speakingRef.current=v; setSpeaking(v); }
  // 기기 내장 음성(폴백)
  function deviceSpeak(text){ try{ const s=window.speechSynthesis; if(!s){ setSpk(false); return; } const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; if(voiceRef.current) u.voice=voiceRef.current; u.rate=1.0; u.pitch=1.2; u.onstart=()=>setSpk(true); u.onend=()=>setSpk(false); u.onerror=()=>setSpk(false); s.speak(u); try{s.resume();}catch{} }catch{ setSpk(false); } }
  // 또또 음성: OpenAI TTS(자연스러움) 우선 → 실패/미설정 시 기기 음성 폴백. 말하는 동안 연속 인식 입력 무시(에코 방지).
  async function speak(text){ if(!voiceOn||!text) return; setSpk(true);
    try{
      const res = await fetch('/api/tts',{ method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer '+token}, body: JSON.stringify({ text, buddy: buddy && buddy.key }) });
      if(!res.ok) throw 0;
      const url = URL.createObjectURL(await res.blob());
      const a = audioRef.current || (audioRef.current = new Audio());
      a.onended=()=>{ setSpk(false); try{URL.revokeObjectURL(url);}catch{} };
      a.onerror=()=>{ setSpk(false); deviceSpeak(text); };
      a.src=url; await a.play();
    }catch{ deviceSpeak(text); }
  }
  // 탭 한 번=오디오 잠금해제 + 연속 마이크 시작(둘 다 이 제스처 안에서). 이후 아이는 말만 하면 됨.
  function startConversation(){ setStarted(true);
    // 모바일 자동재생 잠금해제(이 탭 제스처 안에서): Audio(클라우드 TTS) + speechSynthesis(기기 폴백) 둘 다 — 비동기 speak()로도 iOS 재생되도록
    try{ const a = audioRef.current || (audioRef.current = new Audio()); a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA='; a.play().then(()=>{try{a.pause();a.currentTime=0;}catch{}}).catch(()=>{}); }catch{}
    try{ const s=window.speechSynthesis; if(s){ s.resume(); const w=new SpeechSynthesisUtterance(' '); w.volume=0; s.speak(w); } }catch{}
    startListen(); const greet=(msgs[0]&&msgs[0].content)||''; speak(greet); }

  useEffect(()=>{ pickVoice(); if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged=pickVoice; },[]);
  function pickBuddy(b){ try{localStorage.setItem('maumotter_buddy_'+child.id,b.key);}catch{} setBuddy(b); api('/session/start',{method:'POST',token,body:{child_id:child.id,buddy:b.key}}).then(d=>{ setSid(d.session_id); setMsgs([{role:'otter',content:d.greeting}]); }).catch(()=>{}); }
  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:'smooth'}); },[msgs,busy]);
  useEffect(()=>{ const t=setInterval(()=>setSecsLeft(s=>{ if(s<=1){ clearInterval(t); finishRef.current&&finishRef.current(); return 0; } return s-1; }),1000); return ()=>clearInterval(t); },[]);
  useEffect(()=>()=>{ manualStopRef.current=true; try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch{} try{audioRef.current&&audioRef.current.pause();}catch{} try{recRef.current&&recRef.current.stop();}catch{} try{detTimerRef.current&&clearInterval(detTimerRef.current);}catch{} try{streamRef.current&&streamRef.current.getTracks().forEach(t=>t.stop());}catch{} },[]);
  useEffect(()=>{ const v=videoRef.current; if(camOn&&v&&streamRef.current){ v.srcObject=streamRef.current; v.muted=true; v.playsInline=true; v.play().catch(()=>{}); } },[camOn]);

  async function sendText(raw){ const t=(raw||'').trim(); if(!t||!sid||busyRef.current) return; setInput(''); setMsgs(m=>[...m,{role:'child',content:t}]); busyRef.current=true; setBusy(true);
    try{ const d=await api('/session/'+sid+'/utterance',{method:'POST',token,body:{content:t}}); setMsgs(m=>[...m,{role:'otter',content:d.reply}]); busyRef.current=false; setBusy(false); speak(d.reply); return; }
    catch{ const fb='또또가 잠깐 딴 생각을 했어! 다시 말해줄래?'; setMsgs(m=>[...m,{role:'otter',content:fb}]); busyRef.current=false; setBusy(false); speak(fb); } }
  sendTextRef.current=sendText;
  function send(){ sendText(input); }

  // 연속 인식: 시작 탭(제스처)에서 한 번 start → 세션 내내 유지. 말하는 동안/처리 중엔 결과 무시. 끊기면 자동 재시작.
  function startListen(){ if(!SRsupported) return;
    try{ const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      let rec=recRef.current;
      if(!rec){ rec=new SR(); rec.lang='ko-KR'; rec.continuous=true; rec.interimResults=false; rec.maxAlternatives=1;
        rec.onresult=(e)=>{ if(speakingRef.current||busyRef.current) return; let t=''; for(let i=e.resultIndex;i<e.results.length;i++){ if(e.results[i].isFinal) t+=e.results[i][0].transcript; } t=t.trim(); if(t&&sendTextRef.current) sendTextRef.current(t); };
        rec.onerror=(ev)=>{ if(ev&&(ev.error==='not-allowed'||ev.error==='service-not-allowed')){ manualStopRef.current=true; setListening(false); } };
        rec.onend=()=>{ if(manualStopRef.current){ setListening(false); } else { try{ rec.start(); }catch{ setListening(false); } } };
        recRef.current=rec; }
      manualStopRef.current=false; try{ rec.start(); }catch{} setListening(true);
    }catch{ setListening(false); } }
  function stopListen(){ manualStopRef.current=true; try{recRef.current&&recRef.current.stop();}catch{} setListening(false); }

  // 표정 카메라 — 프레임은 기기 안에서만 분석, 원본 미저장·미전송. 종료 시 요약 텍스트만 통역에 보조.
  async function startCam(){ if(camOn||camLoading) return; setCamLoading(true);
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}); streamRef.current=stream;
      const fa=await loadFaceApi(); setCamOn(true); setCamLoading(false);
      detTimerRef.current=setInterval(async()=>{ const v=videoRef.current; if(!v||v.readyState<2) return;
        try{ const r=await fa.detectSingleFace(v,new fa.TinyFaceDetectorOptions()).withFaceExpressions();
          if(r&&r.expressions){ let top='',mx=0; for(const k in r.expressions){ if(r.expressions[k]>mx){ mx=r.expressions[k]; top=k; } } if(top&&mx>0.55) exprRef.current[top]=(exprRef.current[top]||0)+1; }
        }catch{} },1500);
    }catch(e){ setCamLoading(false); try{streamRef.current&&streamRef.current.getTracks().forEach(t=>t.stop());}catch{} streamRef.current=null; alert('카메라를 시작할 수 없어요. 권한을 확인해 주세요.'); } }
  function stopCam(){ try{detTimerRef.current&&clearInterval(detTimerRef.current);}catch{} detTimerRef.current=null; try{streamRef.current&&streamRef.current.getTracks().forEach(t=>t.stop());}catch{} streamRef.current=null; setCamOn(false); }
  function exprSummary(){ const ent=Object.entries(exprRef.current).sort((a,b)=>b[1]-a[1]); if(!ent.length) return ''; return '세션 동안 표정은 주로 '+ent.slice(0,2).map(([k])=>EXPR_LABEL[k]||k).join(', ')+'으로 보였어요'; }

  async function finish(){ if(!sid||ending) return; setEnding(true); manualStopRef.current=true; try{recRef.current&&recRef.current.stop();}catch{} try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch{} try{audioRef.current&&audioRef.current.pause();}catch{} const es=exprSummary(); stopCam(); try{ const d=await api('/session/'+sid+'/end',{method:'POST',token,body:es?{expression_summary:es}:{}}); onEnd(d); }catch{ onEnd(null); } }
  finishRef.current=finish;
  const mm=Math.floor(secsLeft/60), ss=String(secsLeft%60).padStart(2,'0');
  let lastOtter=''; for(let i=msgs.length-1;i>=0;i--){ if(msgs[i].role==='otter'){ lastOtter=msgs[i].content; break; } }
  let remembered=null; try{ remembered=localStorage.getItem('maumotter_buddy_'+child.id); }catch{}
  if(!buddy) return html`<div style=${{minHeight:'100vh',display:'flex',flexDirection:'column',justifyContent:'center',background:'linear-gradient(165deg,#F4EFE6,#FBF8F1)'}}>
    <div class="topbar" style=${{position:'fixed',top:0,left:0,right:0,background:'transparent',borderBottom:'none'}}><span></span><span class="muted" style=${{cursor:'pointer'}} onClick=${onBack}>← 뒤로</span></div>
    <div style=${{textAlign:'center',marginBottom:22}}><div class="h1">누구랑 이야기할까?</div><div class="muted" style=${{marginTop:4}}>마음을 들어줄 친구를 골라요</div></div>
    <div style=${{display:'flex',gap:16,justifyContent:'center',flexWrap:'wrap'}}>
      ${BUDDIES.map(b=>html`<div key=${b.key} onClick=${()=>pickBuddy(b)} style=${{cursor:'pointer',textAlign:'center'}}>
        <img src=${b.img} alt=${b.name} style=${{width:'40vw',maxWidth:165,height:'40vw',maxHeight:165,objectFit:'cover',borderRadius:30,boxShadow:remembered===b.key?'0 0 0 4px var(--water), 0 6px 18px rgba(0,0,0,0.18)':'0 6px 18px rgba(0,0,0,0.14)'}} />
        <div style=${{marginTop:10,fontWeight:700,fontSize:18}}>${b.name}</div>
        ${remembered===b.key && html`<div class="muted" style=${{fontSize:12,marginTop:2}}>⭐ 지난번 친구</div>`}
      </div>`)}
    </div>
  </div>`;
  return html`<div style=${{minHeight:'100vh',display:'flex',flexDirection:'column',background:'linear-gradient(165deg,#F4EFE6,#FBF8F1)'}}>
    <div class="topbar"><b>🦦 ${buddy.name}</b><div style=${{display:'flex',alignItems:'center',gap:10}}>
      <button onClick=${camOn?stopCam:startCam} disabled=${camLoading} title="표정 카메라(기기 안에서만)" style=${{background:'none',border:'none',fontSize:20,cursor:camLoading?'default':'pointer',opacity:camLoading?0.5:1}}>${camOn?'📷':'📵'}</button>
      <button onClick=${()=>{ if(voiceOn){try{window.speechSynthesis.cancel();}catch{} try{audioRef.current&&audioRef.current.pause();}catch{} setSpk(false);} setVoiceOn(v=>!v); }} title="또또 목소리" style=${{background:'none',border:'none',fontSize:20,cursor:'pointer'}}>${voiceOn?'🔊':'🔇'}</button>
      <span class="muted" style=${{fontSize:12}}>${mm}:${ss}</span>
      <button class="btn-ghost" style=${{padding:'7px 12px',borderRadius:10,cursor:'pointer'}} disabled=${ending} onClick=${finish}>${ending?'정리 중…':'오늘은 여기까지'}</button>
    </div></div>
    ${(camOn||camLoading) && html`<div style=${{display:'flex',alignItems:'center',gap:8,padding:'6px 14px',background:'#FBEFE9',borderBottom:'1px solid var(--line)'}}>
      <video ref=${videoRef} style=${{width:44,height:44,borderRadius:10,objectFit:'cover',background:'#000'}}></video>
      <span class="muted" style=${{fontSize:12}}>${camLoading?'카메라 준비 중…':'📷 표정도 함께 보고 있어요 (기기 안에서만 · 영상은 저장 안 해요)'}</span>
    </div>`}
    <div style=${{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',textAlign:'center',padding:'8px 20px 0'}}>
      <div style=${{position:'relative',width:'min(66vw,272px)',height:'min(66vw,272px)',borderRadius:40,overflow:'hidden',boxShadow:speaking?'0 0 0 6px #BBD9EA, 0 12px 30px rgba(91,124,125,0.4)':'0 8px 22px rgba(0,0,0,0.14)',transition:'box-shadow .25s',animation:(speaking?'bob 1.6s':'bob 3.6s')+' ease-in-out infinite'}}>
        <img src=${buddy.img} alt=${buddy.name} style=${{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',opacity:speaking?0:1,transition:'opacity .3s'}} />
        <img src=${buddy.talk||buddy.img} alt="" aria-hidden="true" style=${{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',opacity:speaking?1:0,transition:'opacity .3s'}} />
      </div>
      ${!started
        ? html`<button class="btn" style=${{marginTop:26,maxWidth:300,fontSize:18,padding:'16px'}} onClick=${startConversation}>🔊 ${buddy.name}랑 이야기 시작하기</button>
            <div class="muted" style=${{fontSize:12,marginTop:8}}>버튼을 누르면 ${buddy.name}가 말을 걸어요</div>`
        : html`<div style=${{marginTop:20,maxWidth:440,width:'100%'}}>
            ${lastOtter && html`<div style=${{display:'inline-block',background:'#fff',border:'1px solid var(--line)',borderRadius:'18px 18px 18px 4px',padding:'13px 17px',fontSize:16,lineHeight:1.55,boxShadow:'0 3px 10px rgba(0,0,0,0.06)',textAlign:'left'}}>${busy?'…':lastOtter}</div>`}
            <div style=${{marginTop:16,fontSize:14,fontWeight:700,color:speaking?'var(--water)':(listening?'#C0492F':'var(--muted)')}}>${busy?buddy.name+'가 생각 중이에요…':(speaking?buddy.name+'가 말하고 있어요 🦦':(listening?'🎙️ 듣고 있어요 — 그냥 말해요':'잠깐 멈췄어요'))}</div>
          </div>`}
    </div>
    ${started && html`<div style=${{padding:'6px 0 16px',textAlign:'center'}}>
      ${SRsupported && html`<button onClick=${listening?stopListen:startListen} disabled=${busy}
        style=${{width:76,height:76,borderRadius:'50%',border:'none',cursor:busy?'default':'pointer',fontSize:30,color:'#fff',background:listening?'#C0492F':'var(--water)',boxShadow:'0 4px 14px rgba(91,124,125,0.4)',animation:listening?'pulse 1.5s infinite':'none'}}>🎤</button>`}
      <div><button onClick=${()=>setShowText(s=>!s)} style=${{background:'none',border:'none',color:'var(--muted)',fontSize:12,cursor:'pointer',marginTop:8,textDecoration:'underline'}}>✏️ 글로 쓸래요</button></div>
      ${showText && html`<div style=${{display:'flex',gap:8,padding:'8px 14px 0',maxWidth:520,margin:'0 auto'}}>
        <input class="field" style=${{marginBottom:0}} placeholder=${buddy.name+'에게 하고 싶은 말'} value=${input} onInput=${e=>setInput(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter')send();}} />
        <button class="btn" style=${{width:60}} disabled=${busy} onClick=${send}>→</button>
      </div>`}
    </div>`}
  </div>`;
}

function Report({ data }) {
  const r = data?.report; const crisis = r?.crisis?.flag;
  if(!r) return html`<div class="card">리포트를 불러오지 못했어요.</div>`;
  return html`<div>
    ${crisis && html`<div class="card" style=${{background:'#FFF4EE',border:'1px solid #F2C9B5'}}>
      <b>🟠 함께 살펴보면 좋아요</b><div class="muted" style=${{marginTop:6}}>${r.crisis.note||'아이의 안전·정서를 위해 전문기관 상담을 권해드려요. (아동보호전문기관 112 / 1577-1391)'}</div></div>`}
    <div class="card"><div class="pill">오늘의 통역</div>
      <div style=${{marginTop:10,lineHeight:1.6}}>${r.summary}</div>
      ${r.feelings?.length>0 && html`<div style=${{marginTop:10}}>${r.feelings.map((f,i)=>html`<span key=${i} class="pill" style=${{marginRight:6}}>#${f}</span>`)}</div>`}
    </div>
    ${r.what_happened && html`<div class="card"><b>무슨 일이 있었나요</b><div class="muted" style=${{marginTop:6,lineHeight:1.6,color:'var(--ink)'}}>${r.what_happened}</div></div>`}
    ${r.parent_tips?.length>0 && html`<div class="card"><b>오늘 이렇게 해보세요</b><ul style=${{margin:'8px 0 0',paddingLeft:18,lineHeight:1.7}}>${r.parent_tips.map((t,i)=>html`<li key=${i}>${t}</li>`)}</ul></div>`}
    ${r.talk_starters?.length>0 && html`<div class="card"><b>대화 물꼬</b><ul style=${{margin:'8px 0 0',paddingLeft:18,lineHeight:1.7}}>${r.talk_starters.map((t,i)=>html`<li key=${i}>"${t}"</li>`)}</ul></div>`}
    <div class="muted" style=${{textAlign:'center',padding:'4px 0 16px'}}>이 통역은 자기이해를 돕는 참고용이며, 의학적 진단이 아닙니다.</div>
  </div>`;
}

function Reports({ token, child, onOpen }) {
  const [list,setList]=useState([]);
  useEffect(()=>{ api('/reports?child_id='+child.id,{token}).then(d=>setList(d.reports)).catch(()=>{}); },[]);
  return html`<div class="wrap">
    <div class="h1" style=${{marginBottom:12}}>${child.name}의 통역 리포트</div>
    ${list.length===0 && html`<div class="muted">아직 리포트가 없어요. 또또와 대화를 마치면 생겨요.</div>`}
    ${list.map(r=>html`<div key=${r.id} class="card" style=${{cursor:'pointer'}} onClick=${()=>onOpen(r.id)}>
      <div style=${{display:'flex',justifyContent:'space-between'}}><b>${(r.created_at||'').slice(0,10)}</b>${r.crisis_flag?html`<span class="pill" style=${{background:'#FFF4EE',color:'#c0492f'}}>살펴보기</span>`:''}</div>
    </div>`)}
  </div>`;
}

// 부모 PIN 게이트 (아이 모드 진입·리포트 열람 보호, spec 2-2). mode 'auto'=없으면 설정/있으면 확인, 'enter'=확인만
function PinGate({ token, mode, title, desc, onPass, onCancel }) {
  const [hasPin,setHasPin]=useState(mode==='enter'?true:null);
  const [pin,setPin]=useState(''); const [pin2,setPin2]=useState(''); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  useEffect(()=>{ if(mode!=='enter') api('/pin',{token}).then(d=>setHasPin(d.hasPin)).catch(()=>setHasPin(false)); },[]);
  const setup = hasPin===false;
  async function submit(){
    setErr(''); setBusy(true);
    try{
      if(setup){
        if(!/^\d{4,6}$/.test(pin)){ setErr('숫자 4~6자리로 만들어주세요'); setBusy(false); return; }
        if(pin!==pin2){ setErr('PIN이 일치하지 않아요'); setBusy(false); return; }
        await api('/pin',{method:'POST',token,body:{pin}}); onPass();
      } else {
        const d=await api('/pin/verify',{method:'POST',token,body:{pin}});
        if(d.ok) onPass(); else setErr('PIN이 맞지 않아요');
      }
    }catch(e){ setErr(e.message||'오류'); } finally{ setBusy(false); }
  }
  if(hasPin===null) return html`<div class="wrap"><div class="muted">잠시만요…</div></div>`;
  return html`<div class="wrap">
    <div style=${{textAlign:'center',padding:'28px 0 14px'}}>
      <div style=${{fontSize:40}}>🔒</div>
      <div class="h1">${title || (setup?'부모 PIN 설정':'부모 확인')}</div>
      <div class="muted">${desc || (setup?'아이 모드 보호를 위해 부모님만 아는 PIN을 만들어요':'부모님만 진행할 수 있어요. PIN을 입력해주세요')}</div>
    </div>
    <div class="card">
      <input class="field" type="password" inputmode="numeric" placeholder="PIN (숫자 4~6자리)" value=${pin} onInput=${e=>setPin(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter'&&!setup)submit();}} />
      ${setup && html`<input class="field" type="password" inputmode="numeric" placeholder="PIN 다시 입력" value=${pin2} onInput=${e=>setPin2(e.target.value)} />`}
      ${err && html`<div class="err">${err}</div>`}
      <button class="btn" disabled=${busy} onClick=${submit}>${busy?'잠시만요…':(setup?'설정하고 시작':'확인')}</button>
      ${onCancel && html`<button class="btn btn-ghost" style=${{marginTop:8}} onClick=${onCancel}>취소</button>`}
    </div>
  </div>`;
}

function Settings({ token, user, onBack }) {
  const [pin,setPin]=useState(''); const [pin2,setPin2]=useState(''); const [msg,setMsg]=useState(''); const [busy,setBusy]=useState(false);
  async function savePin(){ setMsg(''); if(!/^\d{4,6}$/.test(pin)){ setMsg('숫자 4~6자리로 입력해주세요'); return; } if(pin!==pin2){ setMsg('PIN이 일치하지 않아요'); return; }
    setBusy(true); try{ await api('/pin',{method:'POST',token,body:{pin}}); setMsg('✓ PIN이 변경됐어요'); setPin('');setPin2(''); }catch(e){ setMsg(e.message||'오류'); } finally{ setBusy(false); } }
  return html`<div>
    <div class="topbar"><b>설정</b><span class="muted" style=${{cursor:'pointer'}} onClick=${onBack}>← 뒤로</span></div>
    <div class="wrap">
      <div class="card"><div class="muted">계정</div><b>${user?.email||''}</b></div>
      <div class="card"><b>🔒 부모 PIN 변경</b>
        <input class="field" style=${{marginTop:10}} type="password" inputmode="numeric" placeholder="새 PIN (숫자 4~6자리)" value=${pin} onInput=${e=>setPin(e.target.value)} />
        <input class="field" type="password" inputmode="numeric" placeholder="새 PIN 다시 입력" value=${pin2} onInput=${e=>setPin2(e.target.value)} />
        ${msg && html`<div class=${msg.startsWith('✓')?'muted':'err'} style=${{marginBottom:8}}>${msg}</div>`}
        <button class="btn" disabled=${busy} onClick=${savePin}>${busy?'잠시만요…':'PIN 변경'}</button>
      </div>
      <div class="card"><b>개인정보 · 데이터</b>
        <div class="muted" style=${{marginTop:8,lineHeight:1.7}}>
          • 아이와의 대화는 <b>통역 리포트 생성</b>에만 쓰이며, <b>부모님만</b> 열람할 수 있어요.<br/>
          • 음성은 기기에서 <b>텍스트로만</b> 변환되고, 음성 원본은 저장하지 않아요.<br/>
          • (도입 시) 카메라/영상은 기기 안에서만 처리하고 원본을 저장·전송하지 않아요.
        </div>
      </div>
      <div class="card"><b>안내 · 면책</b>
        <div class="muted" style=${{marginTop:8,lineHeight:1.7}}>
          마음수달은 의료·심리 치료 서비스가 아니며, 통역 리포트는 <b>자녀 이해를 돕는 참고용</b>입니다. 의학적 진단이 아니에요. 아이의 안전이 걱정되면 전문기관(아동보호전문기관 <b>112</b> / 1577-1391) 상담을 권해드려요.
        </div>
      </div>
      <a href=${'https://maumgyeot.com/#token='+encodeURIComponent(token)} class="card" style=${{display:'block',textDecoration:'none',color:'inherit'}}>
        <b>🐾 마음곁</b><div class="muted" style=${{marginTop:6}}>반려동물의 마음을 통역해요 — 같은 계정으로 바로 입장 →</div>
      </a>
      <a href="https://maumful.com" target="_blank" rel="noopener noreferrer" class="card" style=${{display:'block',textDecoration:'none',color:'inherit'}}>
        <b>🌿 마음 시리즈</b><div class="muted" style=${{marginTop:6}}>마음풀 — 나를 이해하는 심리검사·마음돌봄 →</div>
      </a>
      <div class="muted" style=${{textAlign:'center',padding:'8px 0'}}>마음수달 · 부모님 휴대폰 전용</div>
    </div>
  </div>`;
}

function App() {
  const [token,setToken]=useState(localStorage.getItem(TOKEN_KEY)||'');
  const [user,setUser]=useState(null);
  const [view,setView]=useState('dashboard'); // dashboard | pinStart | child | handoff | report | reports
  const [child,setChild]=useState(null); const [reportData,setReportData]=useState(null);
  // 마음 시리즈 SSO: 다른 앱에서 #token=…로 넘어오면 그대로 로그인(공용 maum-auth·JWT 공유)
  useEffect(()=>{ const m=(location.hash||'').match(/token=([^&]+)/); if(m){ const t=decodeURIComponent(m[1]); localStorage.setItem(TOKEN_KEY,t); setToken(t); history.replaceState(null,'',location.pathname+location.search); } },[]);
  // 마음풀 SSO 진입: ?sso=… → 수달 계정 단일로그인(계정 자동 연결)
  useEffect(()=>{ try{ const sso=new URLSearchParams(location.search).get('sso'); if(sso){ api('/auth/sso',{method:'POST',body:{sso}}).then(d=>{ localStorage.setItem(TOKEN_KEY,d.token); setToken(d.token); history.replaceState(null,'',location.pathname); }).catch(()=>{}); } }catch(e){} },[]);
  useEffect(()=>{ if(token) api('/auth/me',{token}).then(d=>setUser(d.user)).catch(()=>{ localStorage.removeItem(TOKEN_KEY); setToken(''); }); },[token]);
  function logout(){ localStorage.removeItem(TOKEN_KEY); setToken(''); setUser(null); }
  function back(){ setView('dashboard'); setChild(null); setReportData(null); }
  // 통역(세션) 시작 전 잔여 확인 — 0이면 아이 모드 진입 대신 부모 화면에서 안내(아이가 한도 에러 안 봄)
  async function tryStart(ch){ setChild(ch);
    try{ const d=await api('/entitlement',{token}); if((d.entitlement?.totalRemaining??1)<=0){ setView('quotaWall'); return; } }catch(e){}
    setView('pinStart'); }

  if(!token) return html`<${Auth} onLogin=${(t,u)=>{setToken(t);setUser(u);}} />`;

  // 한도 초과 — 부모 화면(아이 모드 진입 전)
  if(view==='quotaWall' && child) return html`<div>
    <div class="topbar"><b>🦦 마음수달</b><span class="muted" style=${{cursor:'pointer'}} onClick=${back}>← 뒤로</span></div>
    <div class="wrap">
      <div class="card" style=${{textAlign:'center'}}>
        <div style=${{fontSize:42}}>🎟️</div>
        <b>이번 달 통역을 모두 사용했어요</b>
        <div class="muted" style=${{margin:'8px 0 0'}}>이용권 코드를 등록하면 ${child?.name||'아이'}와 다시 이야기를 시작할 수 있어요.</div>
      </div>
      <${EntitlementCard} token=${token} />
      <button class="btn" onClick=${()=>tryStart(child)}>이야기 시작하기</button>
    </div></div>`;

  // 아이 모드 진입 게이트 (부모 PIN)
  if(view==='pinStart' && child) return html`<${PinGate} token=${token} mode="auto"
    onPass=${()=>setView('child')} onCancel=${back} />`;
  // 또또 대화(아이 모드)
  if(view==='child' && child) return html`<${ChildChat} token=${token} child=${child} onBack=${back} onEnd=${(d)=>{ setReportData(d); setView('handoff'); }} />`;
  // 종료 → 부모 핸드오프(아이가 리포트 못 봄)
  if(view==='handoff') return html`<${PinGate} token=${token} mode="enter"
    title="오늘 대화가 끝났어요 🦦" desc="부모님께 휴대폰을 전해주세요. 통역 리포트는 부모님 PIN으로 열려요."
    onPass=${()=>setView('report')} onCancel=${back} />`;
  if(view==='report') return html`<div><div class="topbar"><b>통역 리포트</b><span class="muted" style=${{cursor:'pointer'}} onClick=${back}>완료</span></div><div class="wrap"><${Report} data=${reportData} /></div></div>`;
  if(view==='reports' && child) return html`<div><div class="topbar"><b>🦦 마음수달</b><span class="muted" style=${{cursor:'pointer'}} onClick=${back}>← 뒤로</span></div>
    <${Reports} token=${token} child=${child} onOpen=${(id)=>{ api('/reports/'+id,{token}).then(d=>{setReportData(d);setView('report');}); }} /></div>`;
  if(view==='settings') return html`<${Settings} token=${token} user=${user} onBack=${back} />`;
  return html`<${Dashboard} token=${token} user=${user} onLogout=${logout}
    onStart=${tryStart} onReports=${(ch)=>{setChild(ch);setView('reports');}} onSettings=${()=>setView('settings')} />`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
