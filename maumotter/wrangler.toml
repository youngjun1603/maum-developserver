name = "maumotter"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# 정적 프론트(React CDN) — public/ 를 그대로 서빙. /api/* 는 Worker가 처리.
[assets]
directory = "./public"
binding = "ASSETS"

# 도메인 D1 (children/sessions/utterances/reports)
[[d1_databases]]
binding = "DB"
database_name = "maumotter-db"
database_id = "f404bbb2-678a-440c-ad2b-f2fd341d8702"

# 공용 인증 D1 (마음 시리즈 공유 — 마음곁도 동일 maum-auth 바인딩)
[[d1_databases]]
binding = "AUTH_DB"
database_name = "maum-auth"
database_id = "2df188da-159e-43ea-be31-b2dc39d8501d"   # maum-auth (_shared/maum-auth-schema.sql 적용)

[[kv_namespaces]]
binding = "KV"
id = "9d5fba04837142f4858b949511095f7e"

# 커스텀 도메인 (루트). zone이 같은 Cloudflare 계정에 있으면 deploy 시 DNS·인증서 자동 생성.
[[routes]]
pattern = "maumotter.com"
custom_domain = true

# 시크릿(대시보드 Variables 또는 wrangler secret put):
#   JWT_SECRET        — 마음 시리즈 공유 (마음곁과 동일 값, _shared 2장)
#   ANTHROPIC_API_KEY — 통역/대화 LLM
