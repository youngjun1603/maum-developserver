name = "maumful"
main = "src/index.tsx"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"

[[d1_databases]]
binding       = "DB"
database_name = "maumful-db"
database_id   = "f8046693-876a-4ae4-b734-20c515f9994f"

[[kv_namespaces]]
binding = "KV"
id      = "9f7426807e924916be4dec75793422d9"

[vars]
SERVICE_URL = "https://maumful.com"
# 네이버 서치어드바이저 소유확인 (공개 메타값 — 홈 <head>에 naver-site-verification 출력)
NAVER_SITE_KEY = "5ab23ced0ed56c5c65d55eec0a1ede354a518b02"

[triggers]
crons = ["0 0 1 * *"]
