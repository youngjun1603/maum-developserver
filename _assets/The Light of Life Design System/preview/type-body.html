<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--paper); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-1); }
  .row:last-child { border-bottom: none; }
  .spec { font-family: var(--font-sans); font-size: 10.5px; color: var(--ink-500); flex-shrink: 0; width: 110px; letter-spacing: 0.04em; font-feature-settings: "tnum" 1; }
</style></head>
<body>
  <div class="stack">
    <div class="row"><span class="spec">Body LG · 18</span><span class="body-lg">성도의 마음을 살피는 일은 가벼운 일이 아닙니다.</span></div>
    <div class="row"><span class="spec">Body · 16</span><span class="body">PHQ-9 · GAD-7 무료 검사로 시작하실 수 있습니다.</span></div>
    <div class="row"><span class="spec">Body SM · 14</span><span class="body-sm">교회 단위로 도입하시는 경우 별도 안내가 제공됩니다.</span></div>
    <div class="row"><span class="spec">Caption · 13</span><span class="caption">© 2026 The Light of Life · Official Partner of CTS 기독교TV</span></div>
    <div class="row"><span class="spec">Eyebrow · 12</span><span class="eyebrow">For Churches · 교회를 위해</span></div>
  </div>
</body></html>
