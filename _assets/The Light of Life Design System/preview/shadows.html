<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--paper); display: flex; gap: 20px; align-items: center; justify-content: center; }
  .card { width: 110px; height: 80px; background: var(--white); border-radius: var(--r-lg); display: flex; align-items: flex-end; padding: 10px; font-size: 10.5px; color: var(--ink-500); font-feature-settings: "tnum" 1; }
  .s1 { box-shadow: var(--sh-1); }
  .s2 { box-shadow: var(--sh-2); }
  .s3 { box-shadow: var(--sh-3); }
  .s4 { box-shadow: var(--sh-4); }
  .sg { box-shadow: var(--sh-gold); }
</style></head>
<body>
  <div class="card s1">sh-1</div>
  <div class="card s2">sh-2</div>
  <div class="card s3">sh-3</div>
  <div class="card s4">sh-4</div>
  <div class="card sg" style="background:var(--brand-gold);color:var(--brand-navy-900)">sh-gold</div>
</body></html>
