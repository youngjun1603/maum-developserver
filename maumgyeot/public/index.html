<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>마음곁 — 반려동물 마음 통역</title>
<meta name="description" content="반려동물의 행동(꼬리·귀·자세·소리)과 상황을 읽어 '이런 마음일 수 있어요'를 통역해 드려요. 동물행동학 기반 참고용 서비스." />
<meta property="og:type" content="website" />
<meta property="og:title" content="마음곁 — 반려동물 마음 통역" />
<meta property="og:description" content="반려동물의 행동을 읽어 마음을 통역해요. 무료로 체험해 보세요." />
<meta property="og:url" content="https://maumgyeot.com" />
<meta property="og:image" content="https://maumgyeot.com/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<style>
  :root{ --bg:#FAF7F2; --card:#fff; --ink:#2C2A28; --muted:#8A847C; --line:#ECE6DD; --paw:#E08A52; --teal:#3E8E8A; --warn:#C0492F; }
  *{ box-sizing:border-box; } body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap{ max-width:560px; margin:0 auto; padding:18px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  .h1{ font-size:20px; font-weight:700; }
  .muted{ color:var(--muted); font-size:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
  .field{ width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font-size:15px; margin-bottom:10px; background:#fff; }
  .btn{ width:100%; padding:13px; border:none; border-radius:12px; background:var(--teal); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-ghost{ background:#fff; border:1px solid var(--line); color:var(--ink); }
  .err{ color:var(--warn); font-size:13px; margin-bottom:8px; }
  .pill{ display:inline-block; background:#EAF3F2; color:var(--teal); border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; }
  .chip{ display:inline-block; border:1px solid var(--line); border-radius:999px; padding:8px 12px; margin:0 6px 8px 0; font-size:13px; cursor:pointer; background:#fff; }
  .chip.on{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .conf-high{ background:#E7F4EA; color:#2E7D46; } .conf-medium{ background:#FBF1DD; color:#B9821F; } .conf-low{ background:#EEE; color:#777; }
  body.has-ad{ padding-bottom: 68px; }   /* 앱(AdMob) 하단 배너가 콘텐츠를 가리지 않도록 */
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin></script>
<script>
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);
const TOKEN_KEY = 'maumgyeot_token';
// ⚠️ 스마트스토어 상품(또는 스토어) URL — 등록 후 여기에 채우면 '구매하기' 버튼이 활성화됩니다.
const STORE_URL = '';
function api(path, { method='GET', body, token } = {}) {
  return fetch('/api'+path, {
    method,
    headers: { 'Content-Type':'application/json', ...(token ? { Authorization:'Bearer '+token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  }).then(async r => { const d = await r.json().catch(()=>({})); if(!r.ok){ const e=new Error(d.error||'오류가 발생했어요'); e.code=d.code; e.status=r.status; throw e; } return d; });
}
const SPECIES_LABEL = { cat:'고양이', dog:'개' };

function Auth({ onLogin, onGuest }) {
  const [mode,setMode]=useState('login'); const [email,setEmail]=useState(''); const [pw,setPw]=useState(''); const [name,setName]=useState('');
  const [err,setErr]=useState(''); const [loading,setLoading]=useState(false); const [sent,setSent]=useState(false);
  async function submit(){ setErr(''); setLoading(true);
    try{ const ref=localStorage.getItem('maumgyeot_ref')||undefined;
      const d=await api('/auth/'+mode,{method:'POST',body: mode==='register'?{email,password:pw,name,ref}:{email,password:pw}});
      if(mode==='register') localStorage.removeItem('maumgyeot_ref');
      localStorage.setItem(TOKEN_KEY,d.token); onLogin(d.token,d.user); }
    catch(e){ setErr(e.message); } finally{ setLoading(false); } }
  async function forgot(){ setErr(''); setLoading(true); try{ await api('/auth/forgot-password',{method:'POST',body:{email}}); setSent(true); }catch(e){ setErr(e.message); } finally{ setLoading(false); } }
  return html`<div class="wrap">
    <div style=${{textAlign:'center',padding:'34px 0 18px'}}>
      <div style=${{fontSize:46}}>🐾</div>
      <div class="h1">마음곁</div>
      <div class="muted">반려동물의 행동을 읽어 마음을 통역해요</div>
    </div>
    <div class="card" style=${{background:'#F2FBF7'}}>
      <b>🐾 우리 아이, 지금 무슨 마음일까요?</b>
      <div class="muted" style=${{marginTop:8,lineHeight:1.7,color:'var(--ink)'}}>강아지·고양이가 보내는 행동 신호(꼬리·귀·자세·소리)와 상황을 입력하면, 동물행동학 관점에서 <b>"이런 마음일 수 있어요"</b>를 따뜻하게 풀어드려요.</div>
    </div>
    <div class="card">
      <div class="muted" style=${{fontSize:13,marginBottom:8}}>이렇게 통역해요</div>
      <div style=${{lineHeight:1.9}}>
        <div><b>1.</b> 행동·상황을 고르거나 <b>짧은 영상</b>을 찍어요</div>
        <div><b>2.</b> AI가 동물행동학으로 <b>통역</b>해요</div>
        <div><b>3.</b> 보호자가 우리 아이를 이해하고 대응해요</div>
      </div>
    </div>
    <div style=${{display:'flex',flexWrap:'wrap',gap:6,justifyContent:'center',marginBottom:14}}>
      <span class="pill">단정하지 않는 통역</span><span class="pill">영상 저장 안 함</span><span class="pill">개·고양이 행동 도감</span><span class="pill">건강 신호 안내</span>
    </div>
    <div class="card">
      ${mode==='register' && html`<input class="field" placeholder="이름(선택)" value=${name} onInput=${e=>setName(e.target.value)} />`}
      <input class="field" type="email" placeholder="이메일" value=${email} onInput=${e=>setEmail(e.target.value)} />
      ${mode!=='forgot' && html`<input class="field" type="password" placeholder="비밀번호" value=${pw} onInput=${e=>setPw(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter')submit();}} />`}
      ${err && html`<div class="err">${err}</div>`}
      ${mode==='forgot'
        ? (sent
          ? html`<div class="muted" style=${{color:'var(--teal)'}}>재설정 메일을 보냈어요. 메일함(스팸함 포함)을 확인해 주세요.</div>`
          : html`<button class="btn" disabled=${loading} onClick=${forgot}>${loading?'보내는 중…':'재설정 메일 보내기'}</button>`)
        : html`<button class="btn" disabled=${loading} onClick=${submit}>${loading?'잠시만요…':(mode==='login'?'로그인':'가입하기')}</button>`}
      <div class="muted" style=${{textAlign:'center',marginTop:12,cursor:'pointer'}} onClick=${()=>{setMode(mode==='login'?'register':'login');setErr('');setSent(false);}}>
        ${mode==='login'?'처음이세요? 가입하기':(mode==='forgot'?'← 로그인으로':'이미 계정이 있어요 → 로그인')}
      </div>
      ${mode==='login' && html`<div class="muted" style=${{textAlign:'center',marginTop:8,fontSize:13,cursor:'pointer'}} onClick=${()=>{setMode('forgot');setErr('');setSent(false);}}>비밀번호를 잊으셨나요?</div>`}
    </div>
    <button class="btn btn-ghost" style=${{marginTop:6}} onClick=${onGuest}>로그인 없이 체험해보기 →</button>
    <div class="muted" style=${{textAlign:'center',marginTop:14}}>본 서비스는 수의학적 진단이 아니며, 행동 이해를 돕는 참고용이에요.</div>
  </div>`;
}

function Dashboard({ token, user, onLogout, onObserve, onReports, onGuide }) {
  const [pets,setPets]=useState([]); const [latest,setLatest]=useState({}); const [adding,setAdding]=useState(false);
  const [name,setName]=useState(''); const [species,setSpecies]=useState('cat'); const [breed,setBreed]=useState(''); const [age,setAge]=useState(''); const [pers,setPers]=useState(''); const [err,setErr]=useState('');
  function load(){
    api('/pets',{token}).then(d=>setPets(d.pets)).catch(()=>{});
    api('/reports',{token}).then(d=>{ const m={}; (d.reports||[]).forEach(r=>{ if(!m[r.pet_id]) m[r.pet_id]=r; }); setLatest(m); }).catch(()=>{});
  }
  useEffect(load,[]);
  async function add(){ setErr(''); if(!name.trim()){ setErr('이름을 입력해주세요'); return; }
    try{ await api('/pets',{method:'POST',token,body:{name,species,breed:breed||null,age:age?Number(age):null,personality:pers||null}}); setName('');setBreed('');setAge('');setPers('');setAdding(false); load(); }catch(e){setErr(e.message);} }
  return html`<div>
    <div class="topbar"><b>🐾 마음곁</b><div style=${{display:'flex',gap:14,alignItems:'center'}}>
      <span class="muted" style=${{cursor:'pointer'}} onClick=${onGuide}>행동 도감</span>
      <span class="muted" style=${{cursor:'pointer'}} onClick=${onLogout}>로그아웃</span>
    </div></div>
    <div class="wrap">
      <${VerifyBanner} token=${token} />
      <div class="h1" style=${{marginBottom:12}}>우리 아이</div>
      ${pets.length===0 && html`<div class="card" style=${{background:'#F2FBF7'}}>
        <b>🐾 시작해 볼까요?</b>
        <div class="muted" style=${{marginTop:6,lineHeight:1.8,color:'var(--ink)'}}>1. 아래에서 <b>우리 아이를 등록</b>하세요<br/>2. 행동·상황을 고르거나 <b>짧은 영상</b>을 찍어요<br/>3. AI가 마음을 <b>통역</b>해 드려요</div>
      </div>`}
      ${pets.map(p => html`<div class="card" key=${p.id}>
        <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div><b>${p.species==='cat'?'🐱':'🐶'} ${p.name}</b> <span class="muted">${SPECIES_LABEL[p.species]||''}${p.age?' · '+p.age+'살':''}</span></div>
          ${latest[p.id]?.health_flag?html`<span class="pill" style=${{background:'#FFF4EE',color:'var(--warn)'}}>건강 살펴보기</span>`:''}
        </div>
        ${latest[p.id] && html`<div class="muted" style=${{marginTop:8,fontSize:13,lineHeight:1.5}}>최근 통역(${(latest[p.id].created_at||'').slice(0,10)})<br/>${latest[p.id].summary||''}</div>`}
        <div style=${{display:'flex',gap:8,marginTop:12}}>
          <button class="btn" style=${{flex:1}} onClick=${()=>onObserve(p)}>통역 받기</button>
          <button class="btn btn-ghost" style=${{flex:1}} onClick=${()=>onReports(p)}>지난 통역</button>
        </div>
      </div>`)}
      ${adding ? html`<div class="card">
        <input class="field" placeholder="이름" value=${name} onInput=${e=>setName(e.target.value)} />
        <select class="field" value=${species} onChange=${e=>setSpecies(e.target.value)}><option value="cat">고양이</option><option value="dog">개</option></select>
        <input class="field" placeholder="품종(선택)" value=${breed} onInput=${e=>setBreed(e.target.value)} />
        <input class="field" type="number" placeholder="나이(선택)" value=${age} onInput=${e=>setAge(e.target.value)} />
        <input class="field" placeholder="성격 메모(선택)" value=${pers} onInput=${e=>setPers(e.target.value)} />
        ${err && html`<div class="err">${err}</div>`}
        <button class="btn" onClick=${add}>등록</button>
        <button class="btn btn-ghost" style=${{marginTop:8}} onClick=${()=>setAdding(false)}>취소</button>
      </div>` : html`<button class="btn btn-ghost" onClick=${()=>setAdding(true)}>+ 반려동물 등록</button>`}
      <${EntitlementCard} token=${token} />
      <a href=${'https://maumotter.com/#token='+encodeURIComponent(token)} class="card" style=${{display:'block',textDecoration:'none',color:'inherit',marginTop:16}}>
        <b>🦦 마음수달</b><div class="muted" style=${{marginTop:6}}>아이의 속마음을 또또가 통역해요 — 같은 계정으로 바로 입장 →</div>
      </a>
      <div class="muted" style=${{textAlign:'center',marginTop:24,fontSize:12,lineHeight:1.9}}>
        <a href="/privacy" style=${{color:'inherit'}}>개인정보처리방침</a> · <a href="/terms" style=${{color:'inherit'}}>이용약관</a> · <a href="/faq" style=${{color:'inherit'}}>고객센터</a> · <a href="/account-deletion" style=${{color:'inherit'}}>회원 탈퇴</a>
      </div>
    </div>
  </div>`;
}

// 영상 통역: 후면 카메라로 ~7초 촬영하며 프레임 6장 추출 → 분석에만 일시 전송, 저장 안 함(원본·프레임 미저장).
function Observe({ token, pet, onDone, onBack }) {
  const [sigs,setSigs]=useState([]); const [picked,setPicked]=useState([]); const [context,setContext]=useState(''); const [busy,setBusy]=useState(false); const [err,setErr]=useState(''); const [quotaHit,setQuotaHit]=useState(false);
  const [cam,setCam]=useState(false); const [recording,setRecording]=useState(false); const [prog,setProg]=useState(0);
  const videoRef=useRef(null); const streamRef=useRef(null); const framesRef=useRef([]); const TOTAL=6;
  useEffect(()=>{ api('/behavior?species='+pet.species,{token}).then(d=>setSigs(d.signals||[])).catch(()=>{}); },[]);
  useEffect(()=>()=>{ try{streamRef.current&&streamRef.current.getTracks().forEach(t=>t.stop());}catch{} },[]);
  useEffect(()=>{ const v=videoRef.current; if(cam&&v&&streamRef.current){ v.srcObject=streamRef.current; v.muted=true; v.playsInline=true; v.play().catch(()=>{}); } },[cam]);
  function toggle(code){ setPicked(p=>p.includes(code)?p.filter(x=>x!==code):[...p,code]); }
  const groups = sigs.reduce((acc,s)=>{ (acc[s.group]=acc[s.group]||[]).push(s); return acc; },{});

  async function submit(frames){ const fr=Array.isArray(frames)?frames:[];
    if(picked.length===0 && context.trim().length<2 && fr.length===0){ setErr('행동을 고르거나, 상황을 적거나, 영상을 찍어주세요'); return; }
    setErr(''); setBusy(true);
    try{ const d=await api('/observe',{method:'POST',token,body:{pet_id:pet.id,signals:picked,context,frames:fr}}); onDone(d); }
    catch(e){ setErr(e.message); if(e.code==='QUOTA'||e.status===402){ setQuotaHit(true); } setBusy(false); } }

  async function startVideo(){ try{ const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}); streamRef.current=stream; framesRef.current=[]; setProg(0); setCam(true); }catch{ alert('카메라를 열 수 없어요. 권한을 확인해 주세요.'); } }
  function stopVideo(){ try{streamRef.current&&streamRef.current.getTracks().forEach(t=>t.stop());}catch{} streamRef.current=null; setCam(false); setRecording(false); }
  function grabFrame(){ const v=videoRef.current; if(!v||v.readyState<2) return; const w=360, h=Math.round((v.videoHeight/v.videoWidth)*360)||270; const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(v,0,0,w,h); framesRef.current.push(cv.toDataURL('image/jpeg',0.7)); }
  function startRec(){ if(recording) return; framesRef.current=[]; setRecording(true); setProg(0); let n=0;
    const iv=setInterval(()=>{ grabFrame(); n++; setProg(n); if(n>=TOTAL){ clearInterval(iv); const frames=framesRef.current.slice(); stopVideo(); submit(frames); } },1100); }

  return html`<div>
    <div class="topbar"><b>${pet.species==='cat'?'🐱':'🐶'} ${pet.name} 통역</b><span class="muted" style=${{cursor:'pointer'}} onClick=${()=>{stopVideo();onBack();}}>← 뒤로</span></div>
    <div class="wrap">
      ${cam ? html`<div class="card" style=${{textAlign:'center'}}>
        <video ref=${videoRef} style=${{width:'100%',maxHeight:320,borderRadius:12,background:'#000'}}></video>
        ${recording
          ? html`<div class="muted" style=${{marginTop:12}}>📹 촬영 중… ${prog}/${TOTAL}</div>`
          : html`<button class="btn" style=${{marginTop:12}} onClick=${startRec}>● 촬영 시작 (약 7초)</button>`}
        <button class="btn btn-ghost" style=${{marginTop:8}} disabled=${recording} onClick=${stopVideo}>취소</button>
        <div class="muted" style=${{marginTop:8,fontSize:12}}>${pet.name}의 모습을 비춰주세요. 영상은 분석에만 잠깐 쓰이고 <b>저장하지 않아요</b>.</div>
      </div>` : html`
      <div class="card"><b>1. 어떤 행동을 보였나요?</b> <span class="muted">(여러 개 선택)</span>
        ${Object.entries(groups).map(([g,list])=>html`<div key=${g} style=${{marginTop:12}}>
          <div class="muted" style=${{marginBottom:6}}>${g}</div>
          ${list.map(s=>html`<span key=${s.code} class=${'chip'+(picked.includes(s.code)?' on':'')} onClick=${()=>toggle(s.code)}>${s.label}${s.ambiguous?' ⚠️':''}</span>`)}
        </div>`)}
      </div>
      <div class="card"><b>2. 언제·어디서·무슨 상황이었나요?</b>
        <textarea class="field" style=${{marginTop:10,minHeight:90,resize:'vertical'}} placeholder="예: 저녁에 손님이 왔는데 소파 밑으로 숨었어요" value=${context} onInput=${e=>setContext(e.target.value)}></textarea>
      </div>
      ${err && html`<div class="err">${err}</div>`}
      ${quotaHit && html`<button class="btn" style=${{marginBottom:8}} onClick=${onBack}>🎟️ 돌아가서 이용권 코드 등록하기</button>`}
      <button class="btn" disabled=${busy} onClick=${()=>submit()}>${busy?'마음을 읽는 중…':'통역 받기'}</button>
      <button class="btn btn-ghost" style=${{marginTop:8}} disabled=${busy} onClick=${startVideo}>📹 영상 찍어서 통역받기</button>
      <div class="muted" style=${{textAlign:'center',padding:'10px 0'}}>⚠️ 표시는 맥락에 따라 정반대일 수 있는 신호예요. 단정하지 않고 함께 읽어요.</div>
      `}
    </div>
  </div>`;
}

function Report({ data }) {
  const r = data?.report; if(!r) return html`<div class="card">리포트를 불러오지 못했어요.</div>`;
  const cf = r.confidence||'low'; const CL={high:'높음',medium:'보통',low:'낮음'};
  return html`<div>
    ${r.health_flag?.flag && html`<div class="card" style=${{background:'#FFF4EE',border:'1px solid #F2C9B5'}}>
      <b>🟠 건강을 함께 살펴보세요</b><div class="muted" style=${{marginTop:6}}>${r.health_flag.note||'몸이 불편한 신호일 수 있어요. 수의사 상담을 권해드려요. (진단 아님)'}</div></div>`}
    <div class="card">
      <span class=${'pill conf-'+cf}>신뢰도 ${CL[cf]||cf}</span>
      <div style=${{marginTop:10,lineHeight:1.6}}>${r.summary}</div>
      ${r.body_signals_read?.length>0 && html`<div style=${{marginTop:10}}>${r.body_signals_read.map((s,i)=>html`<span key=${i} class="pill" style=${{marginRight:6}}>${s}</span>`)}</div>`}
    </div>
    ${r.possible_meanings?.length>0 && html`<div class="card"><b>이런 마음일 수 있어요</b>
      ${r.possible_meanings.map((m,i)=>html`<div key=${i} style=${{marginTop:10,paddingTop:10,borderTop:i?'1px solid var(--line)':'none'}}>
        <div style=${{fontWeight:600}}>${m.meaning}</div>
        ${m.why && html`<div class="muted" style=${{marginTop:4,color:'var(--ink)'}}>${m.why}</div>`}
        ${m.caveat && html`<div class="muted" style=${{marginTop:4,color:'var(--warn)'}}>⚠️ ${m.caveat}</div>`}
      </div>`)}
    </div>`}
    ${r.what_to_do?.length>0 && html`<div class="card"><b>이렇게 해보세요</b><ul style=${{margin:'8px 0 0',paddingLeft:18,lineHeight:1.7}}>${r.what_to_do.map((t,i)=>html`<li key=${i}>${t}</li>`)}</ul></div>`}
    <div class="muted" style=${{textAlign:'center',padding:'4px 0 16px'}}>직접 관찰·교감이 가장 중요해요. 이 통역은 참고용이며 수의학적 진단이 아니에요.</div>
  </div>`;
}

function Reports({ token, pet, onOpen }) {
  const [list,setList]=useState([]);
  useEffect(()=>{ api('/reports?pet_id='+pet.id,{token}).then(d=>setList(d.reports)).catch(()=>{}); },[]);
  return html`<div class="wrap">
    <div class="h1" style=${{marginBottom:12}}>${pet.name}의 지난 통역</div>
    ${list.length===0 && html`<div class="muted">아직 통역 기록이 없어요. "통역 받기"로 시작해요.</div>`}
    ${list.map(r=>html`<div key=${r.id} class="card" style=${{cursor:'pointer'}} onClick=${()=>onOpen(r.id)}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}><b>${(r.created_at||'').slice(0,10)}</b>${r.health_flag?html`<span class="pill" style=${{background:'#FFF4EE',color:'var(--warn)'}}>건강</span>`:html`<span class=${'pill conf-'+(r.confidence||'low')}>${({high:'높음',medium:'보통',low:'낮음'})[r.confidence]||''}</span>`}</div>
      <div class="muted" style=${{marginTop:6}}>${r.summary||''}</div>
    </div>`)}
  </div>`;
}

function Behavior({ token, onBack }) {
  const [sp,setSp]=useState('cat'); const [sigs,setSigs]=useState([]);
  useEffect(()=>{ api('/behavior?species='+sp,{token}).then(d=>setSigs(d.signals||[])).catch(()=>{}); },[sp]);
  const groups = sigs.reduce((a,s)=>{ (a[s.group]=a[s.group]||[]).push(s); return a; },{});
  return html`<div>
    <div class="topbar"><b>🐾 행동 도감</b><span class="muted" style=${{cursor:'pointer'}} onClick=${onBack}>← 뒤로</span></div>
    <div class="wrap">
      <div style=${{display:'flex',gap:8,marginBottom:12}}>
        <button class=${'btn '+(sp==='cat'?'':'btn-ghost')} style=${{flex:1}} onClick=${()=>setSp('cat')}>🐱 고양이</button>
        <button class=${'btn '+(sp==='dog'?'':'btn-ghost')} style=${{flex:1}} onClick=${()=>setSp('dog')}>🐶 개</button>
      </div>
      ${Object.entries(groups).map(([g,list])=>html`<div key=${g} class="card">
        <span class="pill">${g}</span>
        ${list.map(s=>html`<div key=${s.code} style=${{marginTop:10}}>
          <div style=${{fontWeight:600}}>${s.label} ${s.ambiguous?html`<span style=${{color:'var(--warn)',fontSize:12}}>⚠️ 다의적</span>`:''}${s.health?html`<span class="muted" style=${{fontSize:12}}> · 건강 관련</span>`:''}</div>
          <div class="muted" style=${{marginTop:2}}>${s.meanings.join(' / ')}</div>
        </div>`)}
      </div>`)}
      <div class="muted" style=${{textAlign:'center',padding:'8px 0'}}>모든 의미는 "~일 수 있음"(단정 아님). 단일 신호로 판단하지 말고 함께 읽어요.</div>
    </div>
  </div>`;
}

// 이메일 인증 안내 — email_required(=발송 설정됨) && 미인증일 때만 표시
function VerifyBanner({ token }) {
  const [st,setSt]=useState(null); const [msg,setMsg]=useState('');
  useEffect(()=>{ api('/auth/me',{token}).then(setSt).catch(()=>{}); },[]);
  if(!st || !st.email_required || st.email_verified) return null;
  async function resend(){ setMsg('보내는 중…'); try{ await api('/auth/resend-verify',{method:'POST',token}); setMsg('인증 메일을 다시 보냈어요. 메일함(스팸함 포함)을 확인해 주세요.'); }catch(e){ setMsg(e.message); } }
  return html`<div class="card" style=${{background:'#FFF7ED',border:'1px solid #FED7AA'}}>
    <b>✉️ 이메일 인증이 필요해요</b>
    <div class="muted" style=${{marginTop:6}}>가입 시 보낸 인증 메일의 링크를 눌러주세요. 인증 후 이용권 등록 등 모든 기능을 이용할 수 있어요.</div>
    <button class="btn btn-ghost" style=${{marginTop:10}} onClick=${resend}>인증 메일 다시 보내기</button>
    ${msg && html`<div class="muted" style=${{marginTop:8,color:'var(--teal)'}}>${msg}</div>`}
  </div>`;
}
// 이용권(쿼터) 표시 + 코드 등록
function EntitlementCard({ token }) {
  const [ent,setEnt]=useState(null); const [code,setCode]=useState(''); const [msg,setMsg]=useState(''); const [err,setErr]=useState(''); const [busy,setBusy]=useState(false); const [hist,setHist]=useState(null);
  useEffect(()=>{ api('/entitlement',{token}).then(d=>setEnt(d.entitlement)).catch(()=>{}); },[]);
  const TYPE_LABEL={sub_light:'구독 라이트',sub_pro:'구독 프로',pack10:'회차권 10회'};
  async function redeem(){ if(!code.trim())return; setErr('');setMsg('');setBusy(true);
    try{ const d=await api('/coupon/redeem',{method:'POST',token,body:{code}}); setEnt(d.entitlement); setCode(''); setMsg('등록 완료! 이용권이 적용됐어요.'); }
    catch(e){ setErr(e.message); } finally{ setBusy(false); } }
  async function toggleHist(){ if(hist!==null){ setHist(null); return; } try{ const d=await api('/history',{token}); setHist(d.redemptions||[]); }catch(e){ setHist([]); } }
  const planLabel = ent ? (ent.plan==='pro'?'프로':ent.plan==='light'?'라이트':'무료') : '';
  return html`<div class="card">
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
      <b>🎟️ 이용권</b>
      ${ent && html`<span class="pill">${planLabel} · 남은 통역 ${ent.totalRemaining}회</span>`}
    </div>
    ${ent && html`<div class="muted" style=${{marginTop:6,fontSize:12}}>이번 달 ${ent.used}/${ent.monthlyAllowance}회 사용${ent.packRemaining?` · 회차권 ${ent.packRemaining}회`:''}${ent.subActive?` · 구독 ~${(ent.subExpires||'').slice(0,10)}`:''}</div>`}
    <div style=${{display:'flex',gap:8,marginTop:10}}>
      <input class="field" style=${{margin:0,flex:1}} placeholder="이용권 코드 입력" value=${code} onInput=${e=>setCode(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter')redeem();}} />
      <button class="btn" style=${{width:'auto',padding:'12px 16px'}} disabled=${busy||!code.trim()} onClick=${redeem}>등록</button>
    </div>
    ${msg && html`<div class="muted" style=${{color:'var(--teal)',marginTop:8}}>${msg}</div>`}
    ${err && html`<div class="err" style=${{marginTop:8}}>${err}</div>`}
    <div class="muted" style=${{marginTop:8,fontSize:12,cursor:'pointer'}} onClick=${toggleHist}>이용 내역 ${hist===null?'보기':'닫기'} ▾</div>
    ${hist!==null && html`<div style=${{marginTop:4}}>${hist.length===0
      ? html`<div class="muted" style=${{fontSize:12}}>아직 등록한 이용권이 없어요.</div>`
      : hist.map((h,i)=>html`<div key=${i} class="muted" style=${{fontSize:12,padding:'3px 0',borderTop:i?'1px solid #F0EBE3':'none'}}>${(h.created_at||'').slice(0,10)} · ${TYPE_LABEL[h.type]||h.type} · <span style=${{fontFamily:'monospace'}}>${h.code}</span></div>`)}</div>`}
    <div style=${{marginTop:12,paddingTop:12,borderTop:'1px solid #ECE6DD'}}>
      <div class="muted" style=${{fontSize:12,marginBottom:6}}>🛒 이용권 구매 (스마트스토어)</div>
      <div class="muted" style=${{fontSize:13,lineHeight:1.7,color:'var(--ink)'}}>라이트 30일·월 30회 7,900원 · 프로 30일·월 100회 14,900원 · 회차권 10회(60일) 6,900원</div>
      ${STORE_URL
        ? html`<a href=${STORE_URL} target="_blank" rel="noopener noreferrer" class="btn" style=${{display:'block',textAlign:'center',textDecoration:'none',marginTop:10}}>스마트스토어에서 구매하기 →</a>`
        : html`<div class="muted" style=${{fontSize:12,marginTop:8}}>스토어 오픈 준비 중이에요. 구매 후 받은 코드를 위에 등록하시면 됩니다.</div>`}
    </div>
  </div>`;
}

// 비회원 미리보기(로그인 전 체험) — /api/observe/guest, 저장 안 함
function GuestObserve({ onSignup, onBack }) {
  const [sp,setSp]=useState('cat'); const [sigs,setSigs]=useState([]); const [picked,setPicked]=useState([]); const [context,setContext]=useState('');
  const [busy,setBusy]=useState(false); const [err,setErr]=useState(''); const [data,setData]=useState(null); const [remaining,setRemaining]=useState(null);
  useEffect(()=>{ api('/behavior?species='+sp).then(d=>setSigs(d.signals||[])).catch(()=>{}); setPicked([]); },[sp]);
  const groups = sigs.reduce((a,s)=>{ (a[s.group]=a[s.group]||[]).push(s); return a; },{});
  function toggle(code){ setPicked(p=>p.includes(code)?p.filter(x=>x!==code):[...p,code]); }
  async function submit(){ if(picked.length===0 && context.trim().length<2){ setErr('행동을 고르거나 상황을 적어주세요'); return; } setErr('');setBusy(true);
    try{ const d=await api('/observe/guest',{method:'POST',body:{species:sp,signals:picked,context}}); setData(d); setRemaining(d.remaining); }
    catch(e){ setErr(e.message); } finally{ setBusy(false); } }
  if(data) return html`<div>
    <div class="topbar"><b>미리보기 통역</b><span class="muted" style=${{cursor:'pointer'}} onClick=${onBack}>← 뒤로</span></div>
    <div class="wrap">
      <${Report} data=${data} />
      <div class="card" style=${{textAlign:'center',background:'#EAF3F2'}}>
        <b>가입하면 더 깊이 이용할 수 있어요</b>
        <div class="muted" style=${{margin:'6px 0 12px'}}>우리 아이 등록 · 영상 통역 · 지난 기록까지. 가입 시 매월 무료 통역을 드려요.${remaining!=null?` (남은 미리보기 ${remaining}회)`:''}</div>
        <button class="btn" onClick=${onSignup}>가입하고 계속하기</button>
      </div>
    </div></div>`;
  return html`<div>
    <div class="topbar"><b>🐾 미리보기 체험</b><span class="muted" style=${{cursor:'pointer'}} onClick=${onBack}>← 뒤로</span></div>
    <div class="wrap">
      <div style=${{display:'flex',gap:8,marginBottom:12}}>
        <button class=${'btn '+(sp==='cat'?'':'btn-ghost')} style=${{flex:1}} onClick=${()=>setSp('cat')}>🐱 고양이</button>
        <button class=${'btn '+(sp==='dog'?'':'btn-ghost')} style=${{flex:1}} onClick=${()=>setSp('dog')}>🐶 개</button>
      </div>
      <div class="card"><b>어떤 행동을 보였나요?</b> <span class="muted">(여러 개 선택)</span>
        ${Object.entries(groups).map(([g,list])=>html`<div key=${g} style=${{marginTop:12}}>
          <div class="muted" style=${{marginBottom:6}}>${g}</div>
          ${list.map(s=>html`<span key=${s.code} class=${'chip'+(picked.includes(s.code)?' on':'')} onClick=${()=>toggle(s.code)}>${s.label}${s.ambiguous?' ⚠️':''}</span>`)}
        </div>`)}
      </div>
      <div class="card"><b>무슨 상황이었나요?</b>
        <textarea class="field" style=${{marginTop:10,minHeight:80,resize:'vertical'}} placeholder="예: 손님이 오자 소파 밑으로 숨었어요" value=${context} onInput=${e=>setContext(e.target.value)}></textarea>
      </div>
      ${err && html`<div class="err">${err}</div>`}
      <button class="btn" disabled=${busy} onClick=${submit}>${busy?'마음을 읽는 중…':'무료로 통역 받아보기'}</button>
      <div class="muted" style=${{textAlign:'center',padding:'10px 0',fontSize:12}}>로그인 없이 체험용이에요. 결과는 저장되지 않아요.</div>
    </div></div>`;
}

function App() {
  const [token,setToken]=useState(localStorage.getItem(TOKEN_KEY)||'');
  const [user,setUser]=useState(null); const [view,setView]=useState('dashboard'); const [pet,setPet]=useState(null); const [reportData,setReportData]=useState(null); const [guest,setGuest]=useState(false);
  // 마음 시리즈 SSO: 다른 앱에서 #token=…로 넘어오면 그대로 로그인(공용 maum-auth·JWT 공유)
  useEffect(()=>{ const m=(location.hash||'').match(/token=([^&]+)/); if(m){ const t=decodeURIComponent(m[1]); localStorage.setItem(TOKEN_KEY,t); setToken(t); history.replaceState(null,'',location.pathname+location.search); } },[]);
  // 제휴 추적: ?ref=파트너 최초 유입 1회 저장(first-touch). 가입 시 귀속.
  useEffect(()=>{ try{ const r=new URLSearchParams(location.search).get('ref'); if(r && !localStorage.getItem('maumgyeot_ref')) localStorage.setItem('maumgyeot_ref', r.slice(0,64)); }catch{} },[]);
  useEffect(()=>{ if(token) api('/auth/me',{token}).then(d=>setUser(d.user)).catch(()=>{ localStorage.removeItem(TOKEN_KEY); setToken(''); }); },[token]);
  function logout(){ localStorage.removeItem(TOKEN_KEY); setToken(''); setUser(null); }
  function back(){ setView('dashboard'); setPet(null); setReportData(null); }
  if(!token){
    if(guest) return html`<${GuestObserve} onBack=${()=>setGuest(false)} onSignup=${()=>setGuest(false)} />`;
    return html`<${Auth} onLogin=${(t,u)=>{setToken(t);setUser(u);}} onGuest=${()=>setGuest(true)} />`;
  }
  if(view==='observe' && pet) return html`<${Observe} token=${token} pet=${pet} onBack=${back} onDone=${(d)=>{ setReportData(d); setView('report'); }} />`;
  if(view==='report') return html`<div><div class="topbar"><b>통역 리포트</b><span class="muted" style=${{cursor:'pointer'}} onClick=${back}>완료</span></div><div class="wrap"><${Report} data=${reportData} /></div></div>`;
  if(view==='reports' && pet) return html`<div><div class="topbar"><b>🐾 마음곁</b><span class="muted" style=${{cursor:'pointer'}} onClick=${back}>← 뒤로</span></div>
    <${Reports} token=${token} pet=${pet} onOpen=${(id)=>{ api('/reports/'+id,{token}).then(d=>{setReportData(d);setView('report');}); }} /></div>`;
  if(view==='guide') return html`<${Behavior} token=${token} onBack=${back} />`;
  return html`<${Dashboard} token=${token} user=${user} onLogout=${logout}
    onObserve=${(p)=>{setPet(p);setView('observe');}} onReports=${(p)=>{setPet(p);setView('reports');}} onGuide=${()=>setView('guide')} />`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

// ── AdMob 하단 배너(광고형) — Capacitor 네이티브에서만 동작, 웹 브라우저에선 no-op ──
// ⚠️ 출시 전 교체: banner = 실제 배너 단위 ID, testing = false. (App ID는 AndroidManifest meta-data)
const ADMOB = { banner: 'ca-app-pub-3940256099942544/6300978111', testing: true }; // 현재 Google 테스트 배너 ID
(async function initBannerAd(){
  try{
    if(!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) return;
    const AdMob = window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob;
    if(!AdMob) return;
    await AdMob.initialize();
    await AdMob.showBanner({ adId: ADMOB.banner, adSize: 'ADAPTIVE_BANNER', position: 'BOTTOM_CENTER', margin: 0, isTesting: ADMOB.testing });
    document.body.classList.add('has-ad');
  }catch(e){ /* 웹/플러그인 미설치 환경은 조용히 무시 */ }
})();
</script>
