<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--paper); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-1); }
  .row:last-child { border-bottom: none; }
  .spec { font-family: var(--font-sans); font-size: 10.5px; color: var(--ink-500); flex-shrink: 0; width: 110px; letter-spacing: 0.04em; font-feature-settings: "tnum" 1; }
</style></head>
<body>
  <div class="stack">
    <div class="row"><span class="spec">Display 2XL · 92</span><span class="display-2xl">말씀으로 치유하는</span></div>
    <div class="row"><span class="spec">Display XL · 68</span><span class="display-xl">The Light of Life</span></div>
    <div class="row"><span class="spec">H1 · 36</span><span class="h1">성경적 상담과 임상 심리검사</span></div>
    <div class="row"><span class="spec">H2 · 28</span><span class="h2">교회 단위 도입 안내</span></div>
    <div class="row"><span class="spec">H3 · 22</span><span class="h3">Christian counseling, clinically grounded</span></div>
  </div>
</body></html>
