<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--paper); font-family: var(--font-sans); }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brand-gold-700); margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; margin-bottom: 12px; }
  .sw { aspect-ratio: 1.4; border-radius: 4px; display: flex; align-items: flex-end; padding: 6px; font-size: 9px; box-shadow: var(--sh-inset-hairline); font-feature-settings: "tnum" 1; }
  .row .ttl { font-size: 11px; font-weight: 600; align-self: center; grid-column: span 1; color: var(--ink-700); }
</style></head>
<body>
  <p class="label">Navy · 50–900</p>
  <div class="row">
    <div class="ttl">Navy</div>
    <div class="sw" style="background:#F1F4FA">50</div>
    <div class="sw" style="background:#DCE3EF">100</div>
    <div class="sw" style="background:#B6C2DB">200</div>
    <div class="sw" style="background:#7E91BC;color:#fff">300</div>
    <div class="sw" style="background:#4A6098;color:#fff">400</div>
    <div class="sw" style="background:#2A4178;color:#fff">500</div>
    <div class="sw" style="background:#1A2E5C;color:#fff">600</div>
    <div class="sw" style="background:#0F2044;color:#fff">700</div>
    <div class="sw" style="background:#0B1936;color:#fff">800</div>
    <div class="sw" style="background:#081229;color:#fff">900</div>
  </div>
  <p class="label">Gold · 50–700</p>
  <div class="row">
    <div class="ttl">Gold</div>
    <div class="sw" style="background:#FCF7E8">50</div>
    <div class="sw" style="background:#F7ECC9">100</div>
    <div class="sw" style="background:#F0DEA3">200</div>
    <div class="sw" style="background:#E8CE7A">300</div>
    <div class="sw" style="background:#DCB948">400</div>
    <div class="sw" style="background:#C9A227;color:#0F2044">500</div>
    <div class="sw" style="background:#A8881C;color:#fff">600</div>
    <div class="sw" style="background:#8F7115;color:#fff">700</div>
    <div></div><div></div><div></div>
  </div>
  <p class="label">Purple · 50–700</p>
  <div class="row">
    <div class="ttl">Purple</div>
    <div class="sw" style="background:#F4ECFA">50</div>
    <div class="sw" style="background:#E5D3F1">100</div>
    <div class="sw" style="background:#CAA8E5">200</div>
    <div class="sw" style="background:#A875D6">300</div>
    <div class="sw" style="background:#8642C4;color:#fff">400</div>
    <div class="sw" style="background:#6B21A8;color:#fff">500</div>
    <div class="sw" style="background:#5A1B94;color:#fff">600</div>
    <div class="sw" style="background:#4C1480;color:#fff">700</div>
    <div></div><div></div><div></div>
  </div>
</body></html>
