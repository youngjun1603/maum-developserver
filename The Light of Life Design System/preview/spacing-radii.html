<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--paper); display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .group .ttl { font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brand-gold-700); }
  .box { background: var(--brand-navy); height: 24px; border-radius: 2px; }
  .pair { display: flex; align-items: center; gap: 10px; }
  .pair .num { font-size: 11px; color: var(--ink-500); width: 36px; font-feature-settings: "tnum" 1; }
</style></head>
<body>
  <div class="group">
    <span class="ttl">Spacing scale</span>
    <div class="pair"><span class="num">4</span><div class="box" style="width: 4px"></div></div>
    <div class="pair"><span class="num">8</span><div class="box" style="width: 8px"></div></div>
    <div class="pair"><span class="num">12</span><div class="box" style="width: 12px"></div></div>
    <div class="pair"><span class="num">16</span><div class="box" style="width: 16px"></div></div>
    <div class="pair"><span class="num">24</span><div class="box" style="width: 24px"></div></div>
    <div class="pair"><span class="num">32</span><div class="box" style="width: 32px"></div></div>
    <div class="pair"><span class="num">48</span><div class="box" style="width: 48px"></div></div>
    <div class="pair"><span class="num">64</span><div class="box" style="width: 64px"></div></div>
    <div class="pair"><span class="num">80</span><div class="box" style="width: 80px"></div></div>
    <div class="pair"><span class="num">128</span><div class="box" style="width: 128px"></div></div>
  </div>
  <div class="group">
    <span class="ttl">Radii</span>
    <div class="pair"><span class="num">2</span><div style="width:60px;height:32px;background:var(--brand-navy-100);border-radius:2px"></div></div>
    <div class="pair"><span class="num">6</span><div style="width:60px;height:32px;background:var(--brand-navy-100);border-radius:6px"></div></div>
    <div class="pair"><span class="num">10</span><div style="width:60px;height:32px;background:var(--brand-navy-100);border-radius:10px"></div></div>
    <div class="pair"><span class="num">14</span><div style="width:60px;height:32px;background:var(--brand-navy-100);border-radius:14px"></div></div>
    <div class="pair"><span class="num">20</span><div style="width:60px;height:32px;background:var(--brand-navy-100);border-radius:20px"></div></div>
    <div class="pair"><span class="num">pill</span><div style="width:60px;height:32px;background:var(--brand-navy-100);border-radius:999px"></div></div>
  </div>
</body></html>
