<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--paper); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-pill); font-size: 12px; font-weight: 600; letter-spacing: 0.01em; }
  .b-gold { background: var(--brand-gold-50); color: var(--brand-gold-700); box-shadow: inset 0 0 0 1px rgba(201,162,39,0.35); }
  .b-purple { background: var(--brand-purple-50); color: var(--brand-purple-700); box-shadow: inset 0 0 0 1px rgba(107,33,168,0.25); }
  .b-navy { background: var(--brand-navy-50); color: var(--brand-navy); box-shadow: inset 0 0 0 1px rgba(15,32,68,0.15); }
  .b-solid { background: var(--brand-navy); color: var(--brand-gold-300); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .trust { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--white); border-radius: var(--r-md); box-shadow: var(--sh-inset-hairline); }
  .trust .num { font-family: var(--font-display); font-size: 22px; color: var(--brand-navy); font-weight: 600; }
  .trust .lbl { font-size: 12px; color: var(--ink-500); }
</style></head>
<body>
  <span class="badge b-gold"><span class="dot"></span>CTS 공식 파트너</span>
  <span class="badge b-purple">성경적 AI 상담</span>
  <span class="badge b-navy">PHQ-9 무료</span>
  <span class="badge b-solid">Verified Counselor</span>
  <div class="trust"><span class="num">8</span><span class="lbl">전문 심리검사</span></div>
  <div class="trust"><span class="num">PHQ-9</span><span class="lbl">·  GAD-7 무료</span></div>
</body></html>
