<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--paper); font-family: var(--font-sans); }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .sw { flex: 1; min-height: 96px; border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--sh-inset-hairline); }
  .sw .name { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; }
  .sw .hex  { font-family: var(--font-sans); font-size: 11px; opacity: 0.8; font-feature-settings: "tnum" 1; }
  .label { font-family: var(--font-sans); font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brand-gold-700); margin: 0 0 10px; }
</style></head>
<body>
  <p class="label">Brand · Core</p>
  <div class="row">
    <div class="sw" style="background:#0F2044;color:#FBF9F4"><span class="name">Deep Navy</span><span class="hex">#0F2044 · brand-navy</span></div>
    <div class="sw" style="background:#C9A227;color:#0F2044"><span class="name">Gold</span><span class="hex">#C9A227 · brand-gold</span></div>
    <div class="sw" style="background:#6B21A8;color:#FBF9F4"><span class="name">Purple</span><span class="hex">#6B21A8 · brand-purple</span></div>
  </div>
</body></html>
